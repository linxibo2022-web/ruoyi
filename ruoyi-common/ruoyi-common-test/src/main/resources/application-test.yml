# 测试环境专用配置 — BaseSpringTest 通过 @ActiveProfiles("test") 自动激活
# 依赖外部中间件（MySQL/Redis），CI backend-test 已配套启动 mysql/redis service
spring:
  # 测试环境数据源（与 application-dev.yml 主库同款默认值，可用环境变量覆盖）
  # 不配的话 test profile 下 dynamic-datasource 找不到 primary 数据源
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:erp_sys}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:root}
  data:
    redis:
      # Redis 地址（端口/库等其余项走框架默认值，与 dev 配置一致）
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 10s

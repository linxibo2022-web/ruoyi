## 🖥️ 前端代码审查（如涉及）\r
\r
### 🔴 PC 端严重问题 (plus-ui)\r
\r
#### 1. 使用原生 Element Plus 组件（严重违规）\r
```bash\r
# 检查禁用的原生组件\r
Grep pattern: "<el-dialog" path: plus-ui/src/views/\r
Grep pattern: "<el-input" path: plus-ui/src/views/\r
Grep pattern: "<el-select" path: plus-ui/src/views/\r
Grep pattern: "<el-form.*inline" path: plus-ui/src/views/\r
Grep pattern: "<el-switch" path: plus-ui/src/views/\r
Grep pattern: "<el-date-picker" path: plus-ui/src/views/\r
```\r
\r
**违规示例**:\r
- ❌ `<el-dialog v-model="visible">`\r
- ❌ `<el-input v-model="form.name">`\r
- ❌ `<el-form inline>`\r
\r
**正确写法**:\r
- ✅ `<AModal v-model="visible">`\r
- ✅ `<AFormInput v-model="form.name">`\r
- ✅ `<ASearchForm>`\r
\r
#### 2. 使用原生消息组件\r
```bash\r
# 检查原生消息导入\r
Grep pattern: "import.*ElMessage.*from 'element-plus'" path: plus-ui/src/views/\r
Grep pattern: "ElMessage\\." path: plus-ui/src/views/\r
Grep pattern: "ElNotification\\." path: plus-ui/src/views/\r
```\r
\r
- ❌ `import { ElMessage } from 'element-plus'`\r
- ❌ `ElMessage.success('操作成功')`\r
- ✅ 使用项目封装的消息组件（参考 ad.vue）\r
\r
#### 3. 错误的 API 调用方式\r
```bash\r
# 检查 try-catch 包裹的 API 调用\r
Grep pattern: "try\\s*\\{[^}]*await.*Api\\(" path: plus-ui/src/views/\r
```\r
\r
**违规示例**:\r
```typescript\r
// ❌ 错误\r
try {\r
  const data = await pageAds(params)\r
} catch (error) { }\r
```\r
\r
**正确写法**:\r
```typescript\r
// ✅ 正确\r
const [err, data] = await pageAds(params)\r
if (!err) {\r
  // 处理数据\r
}\r
```\r
\r
#### 4. API 定义缺少类型\r
```bash\r
# 检查 API 文件\r
Grep pattern: ": Result<" path: plus-ui/src/api/ output_mode: files_with_matches\r
```\r
\r
- ❌ 无返回类型或使用 `any`\r
- ✅ `export const pageAds = (query?: AdQuery): Result<PageResult<AdVo>>`\r
\r
#### 5. 未使用封装的表单组件\r
```bash\r
# 检查表单组件使用\r
Grep pattern: "AFormInput" path: plus-ui/src/views/ output_mode: count\r
Grep pattern: "AFormSelect" path: plus-ui/src/views/ output_mode: count\r
Grep pattern: "ASearchForm" path: plus-ui/src/views/ output_mode: count\r
```\r
\r
**检查要点**:\r
- 搜索表单必须使用 `<ASearchForm>`\r
- 输入框必须使用 `<AFormInput>`\r
- 下拉框必须使用 `<AFormSelect>`\r
- 日期选择必须使用 `<AFormDate>`\r
- 开关必须使用 `<AFormSwitch>`\r
\r
### 🔴 移动端严重问题 (plus-uniapp)\r
\r
#### 1. 错误的 WD UI 导入方式（严重违规）\r
```bash\r
# 检查错误的导入源\r
Grep pattern: "from 'wot-design-uni'" path: plus-uniapp/src/\r

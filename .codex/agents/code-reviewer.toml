#### 2. 使用 uni-ui 组件（严重违规）\r
```bash\r
# 检查禁用的 uni-ui 组件\r
Grep pattern: "<uni-forms" path: plus-uniapp/src/\r
Grep pattern: "<uni-field" path: plus-uniapp/src/\r
Grep pattern: "<uni-easyinput" path: plus-uniapp/src/\r
Grep pattern: "<uni-popup" path: plus-uniapp/src/\r
```\r
\r
**违规示例**:\r
- ❌ `<uni-forms>`\r
- ❌ `<uni-field>`\r
- ❌ `<uni-easyinput>`\r
\r
**正确写法**:\r
- ✅ `<wd-form>`\r
- ✅ `<wd-input>`\r
- ✅ `<wd-popup>`\r
\r
#### 3. 使用原生 uni API 进行消息提示\r
```bash\r
# 检查原生 uni API\r
Grep pattern: "uni\\.showToast" path: plus-uniapp/src/\r
Grep pattern: "uni\\.showModal" path: plus-uniapp/src/\r
```\r
\r
- ❌ `uni.showToast({ title: '成功' })`\r
- ✅ `const toast = useToast(); toast.success('成功')`\r
\r
#### 4. 错误的样式单位或注释\r
```bash\r
# 检查样式文件\r
Grep pattern: "//.*rpx" path: plus-uniapp/src/ glob: "*.vue"\r
Grep pattern: "\\\\..*px[^a-z]" path: plus-uniapp/src/ glob: "*.vue"\r
```\r
\r
**违规示例**:\r
```scss\r
// ❌ 错误：使用 px 单位\r
.box {\r
  width: 200px;  // 这是宽度\r
}\r
\r
// ❌ 错误：使用 // 注释\r
```\r
\r
**正确写法**:\r
```scss\r
/* ✅ 正确：使用 rpx 和块注释 */\r
.box {\r
  width: 200rpx;\r
}\r
```\r
\r
#### 5. 错误的目录结构\r
```bash\r
# 检查文件位置\r
Glob pattern: "plus-uniapp/pages/**/*.vue"  # ❌ 错误位置\r
Glob pattern: "plus-uniapp/src/pages/**/*.vue"  # ✅ 正确位置\r
```\r
\r
**检查要点**:\r
- 主页面必须在 `src/pages/`\r
- 子页面（分包）必须在 `src/pages-sub/`\r
- 业务组件必须在 `src/components/`\r
- API 必须在 `src/api/`\r
\r
#### 6. 未参考现有代码（最严重）\r
```bash\r
# 检查是否学习了参考代码的模式\r
Grep pattern: "wd-paging" path: plus-uniapp/src/ output_mode: files_with_matches\r
Grep pattern: "wd-navbar" path: plus-uniapp/src/ output_mode: files_with_matches\r
```\r
\r
**必须参考的文件**:\r
- 列表页：`src/components/tabbar/Home.vue`\r
- 表单页：`src/pages/auth/login.vue`\r
- API：`src/api/app/home/homeApi.ts`\r
\r
### 🟡 前端警告问题\r
\r
#### PC 端警告\r
```bash\r
# 检查表格高度自适应\r
Grep pattern: "useTableHeight" path: plus-ui/src/views/\r
# 检查权限判断\r
Grep pattern: "hasPermi" path: plus-ui/src/views/\r
# 检查字典使用\r
Grep pattern: "useDict" path: plus-ui/src/views/\r
```\r
\r
#### 移动端警告\r
```bash\r
# 检查 API 调用方式\r
Grep pattern: "\\[err, data\\].*await" path: plus-uniapp/src/\r
# 检查 Composables 使用\r
Grep pattern: "useAuth|usePayment|useScroll" path: plus-uniapp/src/pages/\r
```\r
\r
### 🟢 前端最佳实践检查\r
\r
#### PC 端最佳实践\r
1. **表格分页**：使用 `TableData` 和 `PageResult`\r
2. **弹窗管理**：使用 `useDialog` composable\r
3. **表格选择**：使用 `useSelection` composable\r
4. **文件下载**：使用 `useDownload` composable\r
\r
#### 移动端最佳实践\r
1. **列表分页**：使用 `<wd-paging>` 组件\r
2. **下拉刷新**：使用 `wd-paging` 的内置功能\r
3. **路由跳转**：使用 `uni.navigateTo` 或 `uni.redirectTo`\r
4. **认证检查**：使用 `useAuth` composable\r

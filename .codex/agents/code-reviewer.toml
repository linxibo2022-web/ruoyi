## 📋 后端审查清单\r
\r
### 🔴 严重问题（必须修复，阻塞提交）\r
\r
#### 1. 包名规范\r
```bash\r
Grep pattern: "package com\\.ruoyi\\." path: [目标目录]\r
Grep pattern: "import com\\.ruoyi\\." path: [目标目录]\r
```\r
- ❌ `package com.ruoyi.business`\r
- ✅ `package plus.ruoyi.business`\r
\r
#### 2. Service 继承检查\r
```bash\r
Grep pattern: "extends ServiceImpl" path: [目标目录]\r
Grep pattern: "implements IService<" path: [目标目录]\r
```\r
- ❌ `class XxxServiceImpl extends ServiceImpl<XxxMapper, Xxx>`\r
- ✅ `class XxxServiceImpl implements IXxxService`\r
\r
#### 3. DAO 层存在性\r
```bash\r
Glob pattern: "[目标目录]/**/dao/*.java"\r
Glob pattern: "[目标目录]/**/dao/impl/*.java"\r
Grep pattern: "buildQueryWrapper" path: [目标目录] glob: "*DaoImpl.java"\r
```\r
- 必须有 `IXxxDao.java` 和 `XxxDaoImpl.java`\r
- 必须有 `buildQueryWrapper` 方法\r
\r
#### 4. 查询条件位置\r
```bash\r
Grep pattern: "new LambdaQueryWrapper" path: [目标目录] glob: "*ServiceImpl.java"\r
Grep pattern: "Wrappers\\.lambdaQuery" path: [目标目录] glob: "*ServiceImpl.java"\r
```\r
- ❌ Service 层构建 `LambdaQueryWrapper`\r
- ✅ DAO 层 `buildQueryWrapper` 方法\r
\r
#### 5. 完整类型引用\r
```bash\r
Grep pattern: "plus\\.ruoyi\\.[a-z]+\\.[A-Z]" path: [目标目录] glob: "*.java"\r
```\r
- ❌ `public plus.ruoyi.common.core.domain.R<XxxVo> getXxx()`\r
- ✅ `import plus.ruoyi.common.core.domain.R;`\r
\r
### 🟡 警告问题（建议修复）\r
\r
#### 6. Entity 基类（多租户版）\r
```bash\r
Grep pattern: "extends TenantEntity" path: [目标目录]/domain/ glob: "*.java"\r
Grep pattern: "extends BaseEntity" path: [目标目录]/domain/ glob: "*.java"\r
```\r
- 主实体：必须继承 `TenantEntity`\r
- BO：继承 `BaseEntity`\r
\r
#### 7. BO 映射注解\r
```bash\r
Grep pattern: "@AutoMappers" path: [目标目录] glob: "*Bo.java"\r
```\r
- ❌ 无 `@AutoMappers` 注解\r
- ✅ `@AutoMappers({ @AutoMapper(target = Xxx.class), @AutoMapper(target = XxxVo.class) })`\r
\r
#### 8. 对象转换方式\r
```bash\r
Grep pattern: "BeanUtil\\.copy" path: [目标目录]\r
Grep pattern: "BeanUtils\\.copy" path: [目标目录]\r
```\r
- ❌ `BeanUtil.copyProperties()`\r
- ✅ `MapstructUtils.convert()`\r
\r
#### 9. Map 传递业务数据\r
```bash\r
Grep pattern: "Map<String,\\s*Object>" path: [目标目录] glob: "*Service*.java"\r
```\r
- ❌ `Map<String, Object>` 返回业务数据\r
- ✅ 创建专门的 VO 类\r
\r
### 🟢 建议优化\r
\r
#### 10. Mapper 继承\r
```bash\r
Grep pattern: "extends BaseMapperPlus" path: [目标目录]\r
```\r
- 建议使用 `BaseMapper`，不是 `BaseMapperPlus`\r
\r

## 🔧 工作流程\r
\r
### 当用户说"初始化项目文档"或使用 /init-docs 时:\r
1. 读取 `.claude/templates/` 下的三个模板文件\r
2. 分析项目代码结构（扫描 Git 提交、代码目录）\r
3. 填充真实数据，生成三个文档到 `docs/` 目录:\r
   - `docs/项目状态.md`\r
   - `docs/需求文档.md`\r
   - `docs/待办清单.md`\r
4. 生成初始化摘要\r
\r
### 当用户说"更新项目进度"或使用 /update-status 时:\r
1. 读取 `docs/项目状态.md`\r
2. 查看最近 Git 提交（最近 10 条）\r
3. 智能判断哪些任务已完成\r
4. 将"进行中任务"移动到"已完成任务"\r
5. 更新完成日期和整体进度\r
6. 生成更新摘要\r
\r
### 当用户说"添加待办"或使用 /add-todo 时:\r
1. 解析用户输入的任务信息（名称、优先级、时间）\r
2. 读取 `docs/待办清单.md`\r
3. 根据优先级添加到对应区域\r
4. 更新统计信息\r
5. 确认添加成功\r
\r
### 当用户说"查看项目状态"或使用 /progress 时:\r
1. 扫描项目结构（后端、前端、移动端）\r
2. 统计已实现的功能模块\r
3. 读取 `docs/项目状态.md`（如果存在）\r
4. 生成详细的进度报告\r
\r
## 📏 规范要求\r
\r
1. **文档位置**: 统一使用 `docs/` 目录（不是 `.claude/`）\r
2. **文件名**: 中文名称（`项目状态.md`、`需求文档.md`、`待办清单.md`）\r
3. **模板参考**: 从 `.claude/templates/` 读取模板\r
4. **时间格式**: 统一使用 `YYYY-MM-DD HH:MM`\r
5. **任务编号**: REQ-001, TASK-001 格式\r
6. **优先级**: 只使用 高/中/低\r
7. **进度**: 使用百分比(0-100%)\r
8. **状态标记**: 使用 `[ ]` 和 `[x]`\r
9. **不使用"负责人"字段**: 个人项目不需要\r
\r
## 🎨 输出风格\r
\r
- 使用 Markdown 格式\r
- 包含 emoji 提升可读性\r
- 简洁明了,重点突出\r
- 每次更新都添加时间戳\r
- 不要输出过多技术细节\r
\r
## 💡 智能提醒\r
\r
- 如果某个任务进行中超过 7 天,提醒用户检查\r
- 如果待办任务超过 20 个,建议优先级排序\r
- 如果有高优先级任务长期未完成,发出提醒\r
\r

################## 开发环境配置 ##################
# 导入本地敏感配置（每人自己创建 application-dev-local.yml，不提交 Git）
spring:
  config:
    import:
      - optional:application-dev-local.yml
---
# 项目相关配置
app:
  # 应用本地文件上传路径
  upload-path: ${APP_UPLOAD_PATH:D:\download\ruoyi\uploadPath}
  # 应用基础路径(供支付等模块构建回调地址使用)
  base-api: ${APP_BASE_API:http://127.0.0.1:5504}

################## 监控中心配置 ##################
--- # 监控中心配置
spring.boot.admin.client:
  # 开发环境关闭监控客户端
  enabled: ${MONITOR_ENABLED:false}
  # 监控中心地址
  url: ${MONITOR_URL:http://127.0.0.1:9090/admin}
  instance:
    # 注册实例主机类型
    service-host-type: IP
    # 实例元数据
    metadata:
      username: ${MONITOR_USERNAME:ruoyi}
      userpassword: ${MONITOR_PASSWORD:123456}
  # 监控中心认证账号
  username: ${MONITOR_USERNAME:ruoyi}
  # 监控中心认证密码
  password: ${MONITOR_PASSWORD:123456}

################## 数据源配置 ##################
--- # 数据源配置
spring:
  # Flyway 数据库迁移配置
  # 主分支（erp_sys 已有表）→ baseline-on-migrate 跳过低版本
  # 新分支（空库）→ 从 V1 开始完整迁移
  flyway:
    enabled: true
    # 独立配置 url 绕过 dynamic-datasource，直连目标库
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:erp_sys}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    # 已有表的数据源（如主分支 erp_sys）跳过已存在的 V1~V4，只执行新版本
    baseline-on-migrate: true
    baseline-version: 4
  datasource:
    # 数据源类型
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用) - 通过环境变量控制
      p6spy: ${P6SPY_ENABLED:true}
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      # 各个数据源配置
      datasource:
        # 主库数据源
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:erp_sys}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:root}
        # 从库数据源
        slave:
          lazy: true
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DB_SLAVE_HOST:127.0.0.1}:${DB_SLAVE_PORT:3306}/${DB_SLAVE_NAME:erp_sys}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
          username: ${DB_SLAVE_USERNAME:root}
          password: ${DB_SLAVE_PASSWORD:root}
#        # Oracle数据库配置
#        oracle:
#          type: ${spring.datasource.type}
#          driverClassName: oracle.jdbc.OracleDriver
#          url: jdbc:oracle:thin:@//${ORACLE_DB_HOST:127.0.0.1}:${ORACLE_DB_PORT:1521}/${ORACLE_DB_NAME:XE}
#          username: ${ORACLE_DB_USERNAME:ROOT}
#          password: ${ORACLE_DB_PASSWORD:root}
#
#        # PostgreSQL数据库配置
#        postgres:
#          type: ${spring.datasource.type}
#          driverClassName: org.postgresql.Driver
#          url: jdbc:postgresql://${POSTGRES_DB_HOST:127.0.0.1}:${POSTGRES_DB_PORT:5432}/${POSTGRES_DB_NAME:postgres}?useUnicode=true&characterEncoding=utf8&useSSL=${POSTGRES_DB_SSL:true}&autoReconnect=true&reWriteBatchedInserts=true
#          username: ${POSTGRES_DB_USERNAME:root}
#          password: ${POSTGRES_DB_PASSWORD:root}
#
#        # SQL Server数据库配置
#        sqlserver:
#          type: ${spring.datasource.type}
#          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#          url: jdbc:sqlserver://${SQLSERVER_DB_HOST:127.0.0.1}:${SQLSERVER_DB_PORT:1433};DatabaseName=${SQLSERVER_DB_NAME:tempdb};SelectMethod=cursor;encrypt=${SQLSERVER_DB_ENCRYPT:false};rewriteBatchedStatements=true
#          username: ${SQLSERVER_DB_USERNAME:SA}
#          password: ${SQLSERVER_DB_PASSWORD:root}
      # 连接池配置
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000

################## Redis缓存配置 ##################
--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring.data:
  redis:
    # 地址
    host: ${REDIS_HOST:127.0.0.1}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: ${REDIS_DATABASE:0}
    # redis 密码（开发环境可以为空）
#    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl.enabled: false

# redisson 配置
redisson:
  # redis key前缀
  keyPrefix: ${app.id}
  # 线程池数量
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称
    clientName: ${app.id}
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

################## 定时任务配置 ##################
--- # snail-job 配置
snail-job:
  # 是否启用定时任务
  enabled: ${SNAIL_JOB_ENABLED:false}
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: ${app.id}
  # SnailJob 接入验证令牌 详见 script/sql/ry_job.sql `sj_group_config` 表
  token: ${SNAIL_JOB_TOKEN:SJ_cKqBTPzCsWA3VyuCfFoccmuIEGXjr5KT}
  server:
    # 调度中心地址（⚠️ 环境变量必须带 SERVER 前缀，避免被 Relaxed Binding 映射为 snail-job.host 覆盖客户端配置）
    host: ${SNAIL_JOB_SERVER_HOST:127.0.0.1}
    # 调度中心端口（同理，避免覆盖 snail-job.port 客户端端口）
    port: ${SNAIL_JOB_SERVER_PORT:17888}
  # 命名空间UUID 详见 script/sql/ry_job.sql `sj_namespace`表`unique_id`字段
  namespace: ${spring.profiles.active}
  # 随主应用端口漂移
  port: 2${server.port}
  # 客户端ip指定
  host: ${SNAIL_JOB_CLIENT_HOST:}
  # RPC类型: netty, grpc
  rpc-type: grpc

--- # rocketmq 配置
rocketmq:
  # 是否启用 RocketMQ（开发环境启用，用于测试）
  enabled: ${ROCKETMQ_ENABLED:false}
  # NameServer 地址（多个用分号分隔）
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  # 集群名称（用于Topic管理）
  cluster-name: ${ROCKETMQ_CLUSTER_NAME:RuoYiCluster}
  # Broker 地址（用于Topic管理）
  broker-addr: ${ROCKETMQ_BROKER_ADDR:127.0.0.1:10911}

  # 生产者配置
  producer:
    # 生产者组名
    group: ${ROCKETMQ_PRODUCER_GROUP:ruoyi-producer-group-dev}
    # 发送消息超时时间（毫秒）
    send-message-timeout: ${ROCKETMQ_PRODUCER_MESSAGE_TIMEOUT:3000}
    # 消息最大大小（4MB）
    max-message-size: ${ROCKETMQ_PRODUCER_MESSAGE_SIZE:4194304}
    # 发送失败重试次数
    retry-times-when-send-failed: ${ROCKETMQ_PRODUCER_RETRY_FAILED:2}
    # 异步发送失败重试次数
    retry-times-when-send-async-failed: ${ROCKETMQ_PRODUCER_RETRY_ASYNC_FAILED:2}
    # 压缩消息阈值（超过 4KB 自动压缩）
    compress-message-body-threshold: ${ROCKETMQ_PRODUCER_MESSAGE_BODY_THRESHOLD:4096}
    # 是否自动创建 Topic 为 true 时，发送消息前会自动检查并创建
    auto-create-topic: ${ROCKETMQ_PRODUCER_AUTO_CREATE_TOPIC:true}
    # 批量发送消息的最大数量
    batch-size: ${ROCKETMQ_PRODUCER_BATCH_SIZE:100}
    # 是否启用消息发送日志
    enable-log: ${ROCKETMQ_PRODUCER_ENABLE_LOG:true}

  # 消费者配置
  consumer:
    # 消费线程池最小线程数
    consume-thread-min: 20
    # 消费线程池最大线程数
    consume-thread-max: 64
    # 消息拉取批次大小
    pull-batch-size: 32

--- # mqtt 配置（基于 mica-mqtt 2.5.7）
# 注意：仅客户端模式，需要外部 MQTT Broker（如 EMQX、Mosquitto）
# Docker 快速启动 EMQX: docker run -d --name emqx -p 1883:1883 -p 18083:18083 emqx/emqx:latest
mqtt:
  client:
    # 是否启用 MQTT 客户端（需要先启动外部 Broker）
    enabled: ${MQTT_ENABLED:false}
    # 客户端名称
    name: ${MQTT_CLIENT_NAME:Mica-Mqtt-Client}
    # MQTT Broker 地址
    ip: ${MQTT_IP:192.168.168.168}
    # MQTT Broker 端口
    port: ${MQTT_PORT:1883}
    # MQTT 认证信息（如果 Broker 需要认证）
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    # 客户端 ID（如果为空则自动生成）
    # ⚠️ 多节点部署注意：不要配置固定 client-id，让框架自动生成唯一 ID，避免客户端冲突
    client-id: ${MQTT_CLIENT_ID:}
    # 连接超时时间（秒，默认: 5）
    timeout: ${MQTT_TIMEOUT:5}
    # 心跳保活时间（秒，默认: 60）
    keep-alive-secs: ${MQTT_KEEP_ALIVE:60}
    # 是否自动重连（默认: true）
    reconnect: ${MQTT_RECONNECT:true}
    # 重连间隔（毫秒，默认: 5000）
    re-interval: ${MQTT_RE_INTERVAL:5000}
    # MQTT 协议版本（MQTT_3_1 / MQTT_3_1_1 / MQTT_5，默认: MQTT_5）
    version: ${MQTT_VERSION:MQTT_5}
    # 是否清除会话（默认: true）
    # true: 清除之前的会话数据（不接收离线消息）
    # false: 保留会话（接收离线消息，需要 QoS > 0）
    # ⚠️ 集群部署使用共享订阅时，建议设置为 true，避免消息积压
    clean-start: ${MQTT_CLEAN_START:true}
    # 遗嘱消息配置（Last Will，可选）
    # 当客户端异常断开时，Broker 会自动发送遗嘱消息
#    will-message:
#      topic: /test/offline           # 遗嘱消息主题
#      message: client offline        # 遗嘱消息内容
#      qos: QOS1                      # 遗嘱消息 QoS
#      retain: false                  # 是否保留消息
    # SSL 配置（可选）
#    ssl:
#      enabled: false
#      keystore-path: classpath:/certs/keystore.jks
#      keystore-pass: password
#      truststore-path: classpath:/certs/truststore.jks
#      truststore-pass: password

################## 邮件服务配置 ##################
--- # mail 邮件发送
mail:
  # 是否启用邮件服务
  enabled: ${MAIL_ENABLED:false}
  # SMTP服务器地址
  host: ${MAIL_HOST:smtp.163.com}
  # SMTP服务器端口
  port: ${MAIL_PORT:465}
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: ${MAIL_FROM:xxx@163.com}
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: ${MAIL_USERNAME:xxx@163.com}
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: ${MAIL_PASSWORD:xxxxxxxxxx}
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0

################## 短信服务配置 ##################
--- # sms 短信 支持 阿里云 腾讯云 云片 等等各式各样的短信服务商
# https://sms4j.com/doc3/ 差异配置文档地址 支持单厂商多配置，可以配置多个同时使用
sms:
  # 配置源类型用于标定配置来源(interface,yaml)
  config-type: yaml
  # 用于标定yml中的配置是否开启短信拦截，接口配置不受此限制
  restricted: true
  # 短信拦截限制单手机号每分钟最大发送，只对开启了拦截的配置有效
  minute-max: 1
  # 短信拦截限制单手机号每日最大发送量，只对开启了拦截的配置有效
  account-max: 30
  # 以下配置来自于 org.dromara.sms4j.provider.config.BaseConfig类中
  blends:
    # 唯一ID 用于发送短信寻找具体配置 随便定义别用中文即可
    # 可以同时存在两个相同厂商 例如: ali1 ali2 两个不同的阿里短信账号 也可用于区分租户
    config1:
      # 框架定义的厂商名称标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: alibaba
      # 有些称为accessKey有些称之为apiKey，也有称为sdkKey或者appId。
      access-key-id: ${SMS_ALI_ACCESS_KEY:您的accessKey}
      # 称为accessSecret有些称之为apiSecret
      access-key-secret: ${SMS_ALI_ACCESS_SECRET:您的accessKeySecret}
      signature: ${SMS_ALI_SIGNATURE:您的短信签名}
      sdk-app-id: ${SMS_ALI_SDK_APP_ID:您的sdkAppId}
    config2:
      # 厂商标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: tencent
      access-key-id: ${SMS_TENCENT_ACCESS_KEY:您的accessKey}
      access-key-secret: ${SMS_TENCENT_ACCESS_SECRET:您的accessKeySecret}
      signature: ${SMS_TENCENT_SIGNATURE:您的短信签名}
      sdk-app-id: ${SMS_TENCENT_SDK_APP_ID:您的sdkAppId}


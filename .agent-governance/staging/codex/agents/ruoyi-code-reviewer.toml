仅进行只读审查：基于实际文件、测试结果和项目规则，指出问题的严重度、证据位置、影响范围及缺失的验证。不得修改文件、运行写入操作或委派子代理。不要复述技能正文；需要专项规则时只按路由结果按需读取对应技能。


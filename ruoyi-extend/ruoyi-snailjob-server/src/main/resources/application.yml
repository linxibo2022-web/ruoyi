# Snail Job 服务器主配置文件

# 服务器配置
server:
  # 服务端口
  port: ${SERVER_PORT:8800}
  servlet:
    # 应用上下文路径
    context-path: /snail-job

# Spring 基础配置
spring:
  application:
    # 应用名称
    name: ruoyi-snailjob-server
  profiles:
    # 激活的配置文件（使用环境变量）
    active: @profiles.active@
  web:
    resources:
      # 静态资源路径
      static-locations: classpath:admin/

# MyBatis Plus 配置
mybatis-plus:
  typeAliasesPackage: com.aizuda.snailjob.template.datasource.persistence.po
  global-config:
    db-config:
      # 查询条件策略：非空字段才参与查询
      where-strategy: NOT_EMPTY
      # 关闭大写命名
      capital-mode: false
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
  configuration:
    # 下划线转驼峰命名
    map-underscore-to-camel-case: true
    # 启用二级缓存
    cache-enabled: true

# 日志配置
logging:
  # 日志配置文件
  config: classpath:logback-plus.xml
  level:
    # 自定义包的日志级别
    com.aizuda.snailjob: ${LOG_LEVEL:info}

# Spring Boot Actuator 监控端点配置
management:
  endpoints:
    web:
      exposure:
        # 暴露所有端点
        include: '*'
  endpoint:
    health:
      # 健康检查显示详细信息
      show-details: ALWAYS
    logfile:
      # 外部日志文件路径
      external-file: ./logs/ruoyi-snailjob-server/console.log

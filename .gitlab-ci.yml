# GitLab CI — 仅 MR 触发，push 不跑
# 与 .github/workflows/ci.yml 保持同等逻辑

stages:
  - test
  - e2e

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository/
    - plus-ui/node_modules/

# 后端单元测试
backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - mysql:8.0
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: erp_sys
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - mvn -DskipTests=false test -pl ruoyi-modules/ruoyi-business -am

# 前端 Vitest 单元测试
vitest:
  stage: test
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - cd plus-ui && pnpm install --frozen-lockfile && pnpm test:unit

# E2E 冒烟测试
e2e:
  stage: e2e
  image: maven:3.9-eclipse-temurin-21
  services:
    - mysql:8.0
    - redis:7-alpine
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: erp_sys
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update && apt-get install -y curl gnupg
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - corepack enable && corepack prepare pnpm@latest --activate
    - apt-get install -y libnss3 libnspr4 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2
  script:
    - mvn package -DskipTests -pl ruoyi-admin -am -q
    - nohup java -jar ruoyi-admin/target/erp_sys.jar --spring.profiles.active=dev > /tmp/backend.log 2>&1 &
    - for i in $(seq 1 60); do curl -s http://localhost:5504 > /dev/null 2>&1 && echo "后端就绪" && break || sleep 2; done
    - cd plus-ui && pnpm install --frozen-lockfile && npx playwright install --with-deps chromium
    - VITE_APP_PORT=5173 nohup pnpm dev > /tmp/frontend.log 2>&1 &
    - for i in $(seq 1 30); do curl -s http://localhost:5173 > /dev/null 2>&1 && echo "前端就绪" && break || sleep 2; done
    - PLAYWRIGHT_BASE_URL=http://localhost:5173 pnpm test:e2e
  artifacts:
    when: always
    paths:
      - plus-ui/playwright-report/
      - plus-ui/test-results/
    expire_in: 7 days
  after_script:
    - cat /tmp/backend.log 2>/dev/null || true

# Orca 工作树配置（提交 Git，团队共享）
issueCommand: "/brainstorm 现在开始处理Issue {{artifact_url}}，请基于项目现状进行调研和评估，并编写可行的实施方案。"
scripts:
  setup:
    C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\orca-setup.ps1"
  archive:
    C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\orca-archive.ps1"

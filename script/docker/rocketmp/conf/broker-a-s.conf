# ==================== Broker A Slave 配置文件 ====================
# 说明：broker-a 的从节点配置，与 broker-a 组成主从架构
# 主从同步：从节点自动从主节点同步数据，提供消息备份和读负载均衡

# ==================== 集群配置 ====================
# 集群名称 - 与主节点保持一致
brokerClusterName=RuoYiCluster

# Broker 名称 - 必须与主节点一致（表示属于同一个 Broker 组）
brokerName=broker-a

# Broker ID - 大于0表示Slave（主节点 brokerId=0）
brokerId=1

# ==================== NameServer 配置 ====================
# NameServer 地址 - Broker注册到的NameServer地址（多个用分号分隔）
namesrvAddr=127.0.0.1:9876

# ==================== 角色配置 ====================
# Broker 角色 - SLAVE（从节点）
brokerRole=SLAVE

# 刷盘方式：ASYNC_FLUSH（异步刷盘）
flushDiskType=ASYNC_FLUSH

# ==================== 存储配置 ====================
# 存储根目录
storePathRootDir=/home/rocketmq/store

# CommitLog 存储路径
storePathCommitLog=/home/rocketmq/store/commitlog

# ConsumeQueue 存储路径
storePathConsumeQueue=/home/rocketmq/store/consumequeue

# 索引文件存储路径
storePathIndex=/home/rocketmq/store/index

# 删除文件时间点（凌晨4点）
deleteWhen=04

# 文件保留时间（小时）
fileReservedTime=48

# ==================== 网络配置 ====================
# 监听端口 - 不能与主节点冲突
listenPort=10921

# HA 高可用端口 - 用于与主节点同步数据
haListenPort=10922

# Broker 对外IP（Docker 环境必须配置）本地调试线上必须设置线上IP
brokerIP1=127.0.0.1

# ==================== 自动创建配置 ====================
# 自动创建 Topic（生产环境建议关闭）
autoCreateTopicEnable=true

# 自动创建订阅组
autoCreateSubscriptionGroup=true

# ==================== 消息配置 ====================
# 消息体最大大小（字节，默认 4MB）
maxMessageSize=4194304

# 消息删除阈值（磁盘空间使用率超过此值时删除旧消息）
diskMaxUsedSpaceRatio=75

# ==================== 性能优化 ====================
# 发送消息线程池数量
sendMessageThreadPoolNums=4

# 拉取消息线程池数量
pullMessageThreadPoolNums=20

# 查询消息线程池数量
queryMessageThreadPoolNums=10

# ==================== Broker A 配置文件 ====================
# 说明：RocketMQ Broker 核心配置文件
# 部署方式：宿主机网络模式，方便本地开发连接测试

# ==================== 集群配置 ====================
# 集群名称 - 同一集群的Broker使用相同的集群名
brokerClusterName=RuoYiCluster

# Broker 名称 - 集群内唯一标识
brokerName=broker-a

# Broker ID - 0表示Master，大于0表示Slave
brokerId=0

# ==================== NameServer 配置 ====================
# NameServer 地址 - Broker注册到的NameServer地址（多个用分号分隔）
namesrvAddr=127.0.0.1:9876

# ==================== 角色配置 ====================
# Broker 角色 - ASYNC_MASTER(异步主) | SYNC_MASTER(同步主) | SLAVE(从)
brokerRole=ASYNC_MASTER

# 刷盘方式：ASYNC_FLUSH | SYNC_FLUSH
flushDiskType=ASYNC_FLUSH

# ==================== 存储配置 ====================
# 存储根目录
storePathRootDir=/home/rocketmq/store

# CommitLog 存储路径
storePathCommitLog=/home/rocketmq/store/commitlog

# ConsumeQueue 存储路径
storePathConsumeQueue=/home/rocketmq/store/consumequeue

# 索引文件存储路径
storePathIndex=/home/rocketmq/store/index

# 删除文件时间点（凌晨4点）
deleteWhen=04

# 文件保留时间（小时）
fileReservedTime=48

# ==================== 网络配置 ====================
# 监听端口
listenPort=10911

# HA 高可用端口
haListenPort=10912

# Broker 对外IP（Docker 环境必须配置）本地调试线上必须设置线上IP
brokerIP1=127.0.0.1

# ==================== 自动创建配置 ====================
# 自动创建 Topic（生产环境建议关闭）
autoCreateTopicEnable=true

# 自动创建订阅组
autoCreateSubscriptionGroup=true

# ==================== 消息配置 ====================
# 消息体最大大小（字节，默认 4MB）
maxMessageSize=4194304

# 消息删除阈值（磁盘空间使用率超过此值时删除旧消息）
diskMaxUsedSpaceRatio=75

# ==================== 性能优化 ====================
# 发送消息线程池数量
sendMessageThreadPoolNums=4

# 拉取消息线程池数量
pullMessageThreadPoolNums=20

# 查询消息线程池数量
queryMessageThreadPoolNums=10

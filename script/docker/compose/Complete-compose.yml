services:
  mysql:
    image: mysql:8.0.42
    container_name: mysql
    environment:
      # 时区设置 - 统一使用上海时区
      TZ: Asia/Shanghai
      # root用户密码 - MySQL管理员密码（生产环境必须修改）
      MYSQL_ROOT_PASSWORD: mysql123456
      # 初始化数据库 - 容器启动时自动创建的数据库
      MYSQL_DATABASE: erp_sys
    ports:
      # MySQL服务端口映射 - 宿主机端口:容器端口
      - "3306:3306"
    volumes:
      # 数据持久化 - MySQL数据文件存储到宿主机
      - /docker/mysql/data/:/var/lib/mysql/
      # 配置文件映射 - 自定义MySQL配置文件
      - /docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      # MySQL启动参数配置
      # 使用原生密码认证插件（兼容旧版本客户端）
      - --default-authentication-plugin=mysql_native_password
      # 设置字符集为utf8mb4
      - --character-set-server=utf8mb4
      # 设置校对规则
      - --collation-server=utf8mb4_general_ci
      # 显式设置timestamp默认值
      - --explicit_defaults_for_timestamp=true
      # 表名不区分大小写
      - --lower_case_table_names=1
    privileged: true
    network_mode: "host"

  # ==================== Web服务器 ====================
  nginx-web:
    image: nginx:1.23.4
    container_name: nginx-web
    environment:
      # 时区设置 - 统一使用上海时区
      TZ: Asia/Shanghai
    ports:
      # HTTP端口映射 - 标准Web服务端口
      - "80:80"
      # HTTPS端口映射 - SSL加密Web服务端口
      - "443:443"
    volumes:
      # SSL证书映射 - HTTPS证书文件存储
      - /docker/nginx/cert:/etc/nginx/cert
      # 配置文件映射 - Nginx主配置文件
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      # 静态文件目录 - 网站静态资源存储
      - /docker/nginx/html:/usr/share/nginx/html
      # 日志目录映射 - Nginx访问和错误日志
      - /docker/nginx/log:/var/log/nginx
    privileged: true
    network_mode: "host"

  # ==================== 缓存服务 ====================
  redis:
    image: redis:7.2.8
    container_name: redis
    ports:
      # Redis服务端口映射
      - "6379:6379"
    environment:
      # 时区设置 - 统一使用上海时区
      TZ: Asia/Shanghai
    volumes:
      # 配置文件映射 - Redis自定义配置文件
      - /docker/redis/conf:/redis/config:rw
      # 数据持久化 - Redis数据文件存储到宿主机
      - /docker/redis/data/:/redis/data/:rw
    # Redis启动命令 - 使用自定义配置文件启动
    command: "redis-server /redis/config/redis.conf"
    privileged: true
    network_mode: "host"

  # ==================== 对象存储服务 ====================
  minio:
    # MinIO版本说明 - 使用最后一个功能完整版本，后续版本功能被限制
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    ports:
      # MinIO API端口 - 对象存储API服务端口
      - "9000:9000"
      # MinIO控制台端口 - Web管理界面端口
      - "9001:9001"
    environment:
      # 时区设置 - 统一使用上海时区
      TZ: Asia/Shanghai
      # 管理员用户名 - MinIO控制台登录用户名
      MINIO_ROOT_USER: ruoyi
      # 管理员密码 - MinIO控制台登录密码（最少8位字符）
      MINIO_ROOT_PASSWORD: ruoyi123
      # HTTPS域名配置（可选） - 使用HTTPS时需要指定域名
      #MINIO_SERVER_URL: "https://xxx.com:9000"
      #MINIO_BROWSER_REDIRECT_URL: "https://xxx.com:9001"
      # 数据压缩开关 - on开启压缩，off关闭压缩
      MINIO_COMPRESS: "off"
      # 压缩文件扩展名 - 指定需要压缩的文件类型，为空则压缩所有类型
      MINIO_COMPRESS_EXTENSIONS: ""
      # 压缩MIME类型 - 指定需要压缩的MIME类型，为空则压缩所有类型
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      # 数据存储映射 - MinIO对象数据存储到宿主机
      - /docker/minio/data:/data
      # 配置文件映射 - MinIO配置文件存储
      - /docker/minio/config:/root/.minio/
    # MinIO启动命令 - 指定API和控制台端口及数据目录
    command: server --address ':9000' --console-address ':9001' /data
    privileged: true
    network_mode: "host"

  # ==================== 主应用服务（实例1）====================
  erp_sys:
    image: erp_sys:5.6.1
    container_name: erp_sys
    environment:
      # ==================== 基础运行环境配置 ====================
      # 时区设置 - 统一使用上海时区
      TZ: Asia/Shanghai
      # 应用服务端口 - 主应用HTTP服务端口
      SERVER_PORT: 5500
      # SnailJob客户端端口 - 定时任务客户端通信端口
      SNAIL_PORT: 25500
      # 调试端口 - 用于远程调试，生产环境可不配置
      DEBUG_PORT: 5005
      # Spring环境配置 - 指定运行环境(dev/test/prod)
      SPRING_PROFILES_ACTIVE: prod
      # 调试参数 - JVM远程调试配置，生产环境建议设为空
      DEBUG_ARGS: ""

      # ==================== 授权码 ====================
      APP_LICENSE: your-license-code
      # ==================== 离线授权码 ====================
      APP_OFFLINE_LICENSE: your-offline-license-code

      # ==================== 日志级别配置 ====================
      # 应用日志级别 - 控制日志输出详细程度(debug/info/warn/error)
      LOG_LEVEL: info

      # ==================== 数据库配置 ====================
      # 主数据库配置
      # 数据库服务器地址 - MySQL主库IP或域名
      DB_HOST: 127.0.0.1
      # 数据库端口 - MySQL服务端口，默认3306
      DB_PORT: 3306
      # 数据库名称 - 应用使用的数据库名
      DB_NAME: erp_sys
      # 数据库用户名 - 连接数据库的用户账号
      DB_USERNAME: erp_sys
      # 数据库密码 - 连接数据库的用户密码
      DB_PASSWORD: your-database-password

      # 从数据库配置（可选，读写分离时配置）
      # 从库服务器地址 - 用于读操作的从库地址
      DB_SLAVE_HOST: 127.0.0.1
      # 从库端口 - 从库MySQL服务端口
      DB_SLAVE_PORT: 3306
      # 从库数据库名 - 从库数据库名称
      DB_SLAVE_NAME: erp_sys
      # 从库用户名 - 连接从库的用户账号
      DB_SLAVE_USERNAME: erp_sys
      # 从库密码 - 连接从库的用户密码
      DB_SLAVE_PASSWORD: your-database-password

      # 数据库连接池配置（生产环境性能优化）
      # 最大连接池数量 - 连接池最大连接数，根据并发量调整
      DB_MAX_POOL_SIZE: 50
      # 最小空闲连接数 - 连接池最小保持的空闲连接数
      DB_MIN_IDLE: 20

      # 数据库性能分析插件 - 开发环境可开启，生产环境建议关闭
      P6SPY_ENABLED: "false"
      # ==================== Redis缓存配置 ====================
      # Redis服务器地址 - Redis缓存服务器IP或域名
      REDIS_HOST: 127.0.0.1
      # Redis端口 - Redis服务端口，默认6379
      REDIS_PORT: 6379
      # Redis数据库索引 - 使用的Redis数据库编号(0-15)
      REDIS_DATABASE: 0
      # Redis密码 - 连接Redis的密码
      REDIS_PASSWORD: ""
      # Redis SSL连接 - 是否启用SSL加密连接
      REDIS_SSL_ENABLED: "false"
      # Redisson分布式客户端配置（性能优化）
      # Redisson线程数 - 处理Redis操作的线程数
      REDISSON_THREADS: 16
      # Redisson网络线程数 - 处理网络IO的线程数
      REDISSON_NETTY_THREADS: 32
      # 最小空闲连接数 - Redis连接池最小空闲连接
      REDISSON_MIN_IDLE: 32
      # 连接池大小 - Redis连接池最大连接数
      REDISSON_POOL_SIZE: 64

      # ==================== 应用配置 ====================
      # 文件上传路径 - 应用文件上传存储目录
      APP_UPLOAD_PATH: /ruoyi/server/upload
      # 应用基础URL - 用于构建回调地址等（支付、第三方登录等）
      APP_BASE_API: https://ruoyi.plus

      # ==================== 安全配置 ====================
      # JWT密钥 - 用于生成和验证JWT token的密钥
      JWT_SECRET_KEY: uDkkASPQVN5iR4eN

      # API接口加密配置（提高接口安全性）
      # API加密开关 - 是否启用全局接口加密
      API_ENCRYPT_ENABLED: "true"
      # 响应加密公钥 - 用于加密API响应数据的RSA公钥
      API_RESPONSE_PUBLIC_KEY: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAIrZxEhzVAHKJm7BJpXIHWGU3sHJYgRiOOTw3Auj/iNDTL+RExEW2Y0dg/IC71DKxcjvVEA9GdDp0/5nph+4dIMCAwEAAQ==
      # 请求解密私钥 - 用于解密API请求数据的RSA私钥
      API_REQUEST_PRIVATE_KEY: 


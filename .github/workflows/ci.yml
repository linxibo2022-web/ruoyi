# CI — 仅 PR 触发，push 不跑
# ⚠️ 与 .gitlab-ci.yml 保持同等逻辑 — 修改本文件时必须同步检查另一份
name: CI

on:
  pull_request:

jobs:
  # 后端单元测试
  # 注意：不配 Redis service，因为 LangChain4jModuleTest 通过
  # spring.autoconfigure.exclude 排除了 Redisson 自动配置（该测试用内存存储，不需要 Redis）
  backend-test:
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # 库名 — 与 application.yml 的 app.id 一致
          MYSQL_DATABASE: erp_sys
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run backend tests
        # -pl ruoyi-modules/ruoyi-business: 测试 business 模块及其所有依赖链
        run: mvn -DskipTests=false test -pl ruoyi-modules/ruoyi-business -am

  # 前端 Vitest 单元测试
  # 纯逻辑测试，不依赖后端/数据库/浏览器
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # 锁文件路径 — 与 plus-ui/ 目录绑定
          cache-dependency-path: plus-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: cd plus-ui && pnpm install --frozen-lockfile

      - name: Run Vitest
        # 脚本定义在 plus-ui/package.json 的 test:unit
        run: cd plus-ui && pnpm test:unit

  # Playwright E2E 冒烟测试
  playwright:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_sys
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      # 前端端口 — CI 用非特权端口 (>1024)，与 playwright.config.ts 的 PLAYWRIGHT_BASE_URL 配套
      FRONTEND_PORT: '5173'
      # 后端端口 — 与 ruoyi-admin/…/application.yml 的 SERVER_PORT 默认值一致
      BACKEND_PORT: '5504'
      # JAR 名 — 与 ruoyi-admin/pom.xml 的 artifactId 一致
      JAR_NAME: 'erp_sys'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Build backend
        run: mvn package -DskipTests -pl ruoyi-admin -am -q

      - name: Start backend
        run: |
          nohup java -jar ruoyi-admin/target/$JAR_NAME.jar --spring.profiles.active=dev > /tmp/backend.log 2>&1 &
          echo "等待后端启动..."
          for i in $(seq 1 60); do
            curl -s http://localhost:$BACKEND_PORT > /dev/null 2>&1 && echo "后端就绪" && break || sleep 2
          done
          # 循环结束后仍未就绪则直接失败，避免后续步骤报误导性错误
          curl -s http://localhost:$BACKEND_PORT > /dev/null || { echo "❌ 后端 120 秒内未就绪"; exit 1; }

      # 后端启动后 Flyway 已写入 sys_config 表，关闭验证码以便自动化登录
      - name: Disable captcha
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
          mysql -h 127.0.0.1 -u root -proot erp_sys \
            -e "UPDATE sys_config SET config_value='false' WHERE config_key='system.security.captcha-enabled';"
          # 校验关闭结果：0 行匹配或值异常立即失败，避免 E2E 登录超时后误导排查方向
          captcha_value=$(mysql -h 127.0.0.1 -u root -proot -N erp_sys \
            -e "SELECT config_value FROM sys_config WHERE config_key='system.security.captcha-enabled';")
          [ "$captcha_value" = "false" ] || { echo "❌ 验证码关闭失败（当前值: ${captcha_value:-无此配置项}）"; exit 1; }
          echo "验证码已关闭"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plus-ui/pnpm-lock.yaml

      - name: Install Playwright
        run: cd plus-ui && pnpm install --frozen-lockfile && npx playwright install --with-deps chromium

      - name: Start frontend
        run: |
          cd plus-ui && VITE_APP_PORT=$FRONTEND_PORT nohup pnpm dev > /tmp/frontend.log 2>&1 &
          echo "等待前端启动..."
          for i in $(seq 1 30); do
            curl -s http://localhost:$FRONTEND_PORT > /dev/null 2>&1 && echo "前端就绪" && break || sleep 2
          done
          # 循环结束后仍未就绪则直接失败，避免后续步骤报误导性错误
          curl -s http://localhost:$FRONTEND_PORT > /dev/null || { echo "❌ 前端 60 秒内未就绪"; exit 1; }

      - name: Run Playwright E2E
        run: cd plus-ui && PLAYWRIGHT_BASE_URL=http://localhost:$FRONTEND_PORT pnpm test:e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            plus-ui/playwright-report
            plus-ui/test-results
          retention-days: 7

      - name: Print backend log (on failure)
        if: failure()
        run: cat /tmp/backend.log 2>/dev/null || true

      - name: Print frontend log (on failure)
        if: failure()
        run: cat /tmp/frontend.log 2>/dev/null || true

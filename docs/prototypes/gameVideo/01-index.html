<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>短视频 - 首页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#EF4444' } } } }</script>
  <style>
    .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .status-bar { height: 44px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">
  <div class="phone-frame bg-black flex flex-col">
    <div class="status-bar" style="background: transparent; position: absolute; top: 0; left: 0; right: 0; z-index: 50;">
      <span class="text-white">9:41</span>
      <div class="flex items-center gap-1 text-white"><i data-lucide="signal" class="w-4 h-4"></i><i data-lucide="wifi" class="w-4 h-4"></i><i data-lucide="battery-full" class="w-4 h-4"></i></div>
    </div>

    <main class="flex-1 overflow-y-auto relative">
      <!-- 模拟全屏视频背景 -->
      <div class="w-full h-full bg-gradient-to-b from-gray-900 via-gray-800 to-black relative">
        <!-- 顶部 Tab -->
        <div class="absolute top-12 left-0 right-0 z-40 flex justify-center gap-6">
          <span class="text-white/50 text-sm font-medium">关注</span>
          <span class="text-white text-sm font-bold border-b-2 border-white pb-0.5">推荐</span>
        </div>

        <!-- 模拟视频内容区域 -->
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="text-center">
            <div class="w-24 h-24 rounded-full bg-white/10 flex items-center justify-center mx-auto mb-4">
              <i data-lucide="play" class="w-12 h-12 text-white/60"></i>
            </div>
            <p class="text-white/40 text-sm">视频内容区域</p>
          </div>
        </div>

        <!-- 右侧互动栏 -->
        <div class="absolute right-3 bottom-32 z-40 flex flex-col items-center gap-5">
          <!-- 头像 -->
          <div class="relative">
            <div class="w-12 h-12 rounded-full bg-gray-600 flex items-center justify-center border-2 border-white">
              <span class="text-xl">😎</span>
            </div>
            <div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-5 h-5 rounded-full bg-primary flex items-center justify-center">
              <i data-lucide="plus" class="w-3 h-3 text-white"></i>
            </div>
          </div>
          <!-- 点赞 -->
          <div class="text-center">
            <div class="w-10 h-10 flex items-center justify-center">
              <i data-lucide="heart" class="w-7 h-7 text-white"></i>
            </div>
            <span class="text-white text-[10px]">12.8k</span>
          </div>
          <!-- 评论 -->
          <div class="text-center">
            <div class="w-10 h-10 flex items-center justify-center">
              <i data-lucide="message-circle" class="w-7 h-7 text-white"></i>
            </div>
            <span class="text-white text-[10px]">856</span>
          </div>
          <!-- 收藏 -->
          <div class="text-center">
            <div class="w-10 h-10 flex items-center justify-center">
              <i data-lucide="star" class="w-7 h-7 text-white"></i>
            </div>
            <span class="text-white text-[10px]">2,360</span>
          </div>
          <!-- 分享 -->
          <div class="text-center">
            <div class="w-10 h-10 flex items-center justify-center">
              <i data-lucide="share-2" class="w-7 h-7 text-white"></i>
            </div>
            <span class="text-white text-[10px]">分享</span>
          </div>
        </div>

        <!-- 底部视频信息 -->
        <div class="absolute left-4 right-16 bottom-20 z-40">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-white font-bold text-base">@创意小达人</span>
            <span class="bg-primary text-white text-[10px] px-2 py-0.5 rounded-full">关注</span>
          </div>
          <p class="text-white text-sm leading-relaxed">今天教大家做一个超好看的手工折纸 🎨✨ #手工 #折纸 #创意 #治愈</p>
          <div class="flex items-center gap-1.5 mt-2">
            <span class="text-white/60 text-xs">🎵</span>
            <span class="text-white/60 text-xs">原创音乐 - 轻松午后</span>
          </div>
        </div>
      </div>
    </main>

    <nav class="border-t border-gray-800 bg-black safe-area-bottom">
      <div class="flex justify-around py-1.5">
        <a href="01-index.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="home" class="w-5 h-5 text-white"></i><span class="text-[10px] text-white font-medium">首页</span></a>
        <a href="02-discover.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="compass" class="w-5 h-5 text-gray-500"></i><span class="text-[10px] text-gray-500">发现</span></a>
        <a href="03-create.html" class="flex flex-col items-center gap-0.5 min-w-[56px] py-1 no-underline">
          <div class="w-10 h-7 rounded-lg flex items-center justify-center relative">
            <div class="absolute w-8 h-6 rounded bg-cyan-400 left-0.5"></div>
            <div class="absolute w-8 h-6 rounded bg-primary right-0.5"></div>
            <div class="absolute w-8 h-6 rounded bg-white flex items-center justify-center"><i data-lucide="plus" class="w-4 h-4 text-black"></i></div>
          </div>
        </a>
        <a href="05-message.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="message-square" class="w-5 h-5 text-gray-500"></i><span class="text-[10px] text-gray-500">消息</span></a>
        <a href="04-my.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="user" class="w-5 h-5 text-gray-500"></i><span class="text-[10px] text-gray-500">我的</span></a>
      </div>
      <div class="home-indicator" style="background: #333;"></div>
    </nav>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>

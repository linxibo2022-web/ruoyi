<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>短视频 - 我的</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#EF4444' } } } }</script>
  <style>
    .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .status-bar { height: 44px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">
  <div class="phone-frame bg-gray-50 flex flex-col">
    <div class="status-bar bg-white">
      <span>9:41</span>
      <div class="flex items-center gap-1"><i data-lucide="signal" class="w-4 h-4"></i><i data-lucide="wifi" class="w-4 h-4"></i><i data-lucide="battery-full" class="w-4 h-4"></i></div>
    </div>

    <main class="flex-1 overflow-y-auto">
      <!-- 个人信息区 -->
      <div class="bg-white px-5 pt-4 pb-5">
        <div class="flex justify-between items-start mb-4">
          <div class="flex gap-3 items-center">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center" style="border: 3px solid #EF4444;"><span class="text-3xl">😎</span></div>
            <div>
              <p class="text-lg font-bold text-gray-800">创意小达人</p>
              <p class="text-xs text-gray-400">抖音号：creative_2026</p>
            </div>
          </div>
          <button class="w-9 h-9 flex items-center justify-center"><i data-lucide="settings" class="w-5 h-5 text-gray-400"></i></button>
        </div>

        <p class="text-sm text-gray-600 mb-3">分享创意生活 ✨ 用镜头记录美好瞬间 📹</p>

        <!-- 数据统计 -->
        <div class="flex gap-6 mb-4">
          <div class="text-center">
            <p class="text-lg font-bold text-gray-800">26</p>
            <p class="text-[10px] text-gray-400">作品</p>
          </div>
          <div class="text-center">
            <p class="text-lg font-bold text-gray-800">856</p>
            <p class="text-[10px] text-gray-400">粉丝</p>
          </div>
          <div class="text-center">
            <p class="text-lg font-bold text-gray-800">128</p>
            <p class="text-[10px] text-gray-400">关注</p>
          </div>
          <div class="text-center">
            <p class="text-lg font-bold text-gray-800">3,280</p>
            <p class="text-[10px] text-gray-400">获赞</p>
          </div>
        </div>

        <div class="flex gap-3">
          <button class="flex-1 bg-primary text-white text-sm font-medium py-2 rounded-lg">编辑资料</button>
          <button class="flex-1 bg-gray-100 text-gray-700 text-sm font-medium py-2 rounded-lg">分享主页</button>
        </div>
      </div>

      <!-- 作品/收藏 Tab -->
      <div class="bg-white mt-2 px-5 pt-3 pb-0">
        <div class="flex border-b">
          <button class="flex-1 pb-2.5 text-sm font-bold text-gray-800 border-b-2 border-gray-800">作品 26</button>
          <button class="flex-1 pb-2.5 text-sm text-gray-400">收藏 58</button>
          <button class="flex-1 pb-2.5 text-sm text-gray-400">喜欢 186</button>
        </div>
      </div>

      <!-- 作品网格 -->
      <div class="grid grid-cols-3 gap-0.5 mt-0.5">
        <div class="aspect-[3/4] relative" style="background: linear-gradient(135deg, #EF4444, #F87171);">
          <div class="absolute inset-0 flex items-center justify-center"><span class="text-3xl">🎨</span></div>
          <div class="absolute bottom-1 left-1.5 flex items-center gap-0.5"><i data-lucide="play" class="w-3 h-3 text-white"></i><span class="text-white text-[10px]">12.8k</span></div>
        </div>
        <div class="aspect-[3/4] relative" style="background: linear-gradient(135deg, #3B82F6, #60A5FA);">
          <div class="absolute inset-0 flex items-center justify-center"><span class="text-3xl">🌅</span></div>
          <div class="absolute bottom-1 left-1.5 flex items-center gap-0.5"><i data-lucide="play" class="w-3 h-3 text-white"></i><span class="text-white text-[10px]">8.6k</span></div>
          <div class="absolute top-1 right-1"><span class="bg-primary text-white text-[8px] px-1.5 py-0.5 rounded">置顶</span></div>
        </div>
        <div class="aspect-[3/4] relative" style="background: linear-gradient(135deg, #10B981, #34D399);">
          <div class="absolute inset-0 flex items-center justify-center"><span class="text-3xl">🍜</span></div>
          <div class="absolute bottom-1 left-1.5 flex items-center gap-0.5"><i data-lucide="play" class="w-3 h-3 text-white"></i><span class="text-white text-[10px]">5.2k</span></div>
        </div>
        <div class="aspect-[3/4] relative" style="background: linear-gradient(135deg, #F59E0B, #FBBF24);">
          <div class="absolute inset-0 flex items-center justify-center"><span class="text-3xl">🏖️</span></div>
          <div class="absolute bottom-1 left-1.5 flex items-center gap-0.5"><i data-lucide="play" class="w-3 h-3 text-white"></i><span class="text-white text-[10px]">3.6k</span></div>
        </div>
        <div class="aspect-[3/4] relative" style="background: linear-gradient(135deg, #8B5CF6, #A78BFA);">
          <div class="absolute inset-0 flex items-center justify-center"><span class="text-3xl">🎵</span></div>
          <div class="absolute bottom-1 left-1.5 flex items-center gap-0.5"><i data-lucide="play" class="w-3 h-3 text-white"></i><span class="text-white text-[10px]">9.1k</span></div>
        </div>
        <div class="aspect-[3/4] relative" style="background: linear-gradient(135deg, #EC4899, #F472B6);">
          <div class="absolute inset-0 flex items-center justify-center"><span class="text-3xl">💃</span></div>
          <div class="absolute bottom-1 left-1.5 flex items-center gap-0.5"><i data-lucide="play" class="w-3 h-3 text-white"></i><span class="text-white text-[10px]">15.3k</span></div>
        </div>
      </div>
      <div class="h-4"></div>
    </main>

    <nav class="border-t bg-white safe-area-bottom">
      <div class="flex justify-around py-1.5">
        <a href="01-index.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="home" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">首页</span></a>
        <a href="02-discover.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="compass" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">发现</span></a>
        <a href="03-create.html" class="flex flex-col items-center gap-0.5 min-w-[56px] py-1 no-underline">
          <div class="w-10 h-7 rounded-lg flex items-center justify-center relative">
            <div class="absolute w-8 h-6 rounded bg-cyan-400 left-0.5"></div>
            <div class="absolute w-8 h-6 rounded bg-primary right-0.5"></div>
            <div class="absolute w-8 h-6 rounded bg-black flex items-center justify-center"><i data-lucide="plus" class="w-4 h-4 text-white"></i></div>
          </div>
        </a>
        <a href="05-message.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="message-square" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">消息</span></a>
        <a href="04-my.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="user" class="w-5 h-5 text-primary"></i><span class="text-[10px] text-primary font-medium">我的</span></a>
      </div>
      <div class="home-indicator"></div>
    </nav>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>

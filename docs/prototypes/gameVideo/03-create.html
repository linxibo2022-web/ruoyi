<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>短视频 - 创作</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#EF4444' } } } }</script>
  <style>
    .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .status-bar { height: 44px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">
  <div class="phone-frame bg-white flex flex-col">
    <div class="status-bar bg-white">
      <span>9:41</span>
      <div class="flex items-center gap-1"><i data-lucide="signal" class="w-4 h-4"></i><i data-lucide="wifi" class="w-4 h-4"></i><i data-lucide="battery-full" class="w-4 h-4"></i></div>
    </div>

    <main class="flex-1 overflow-y-auto bg-gray-50">
      <div class="bg-white px-5 pt-3 pb-4">
        <p class="text-2xl font-bold text-gray-800 mb-1">创作中心</p>
        <p class="text-xs text-gray-400">记录美好生活，分享精彩瞬间</p>
      </div>

      <!-- 创作方式 -->
      <div class="mx-5 mt-4 grid grid-cols-2 gap-3">
        <div class="bg-white rounded-2xl p-5 shadow-sm text-center">
          <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3" style="background: linear-gradient(135deg, #EF4444, #F87171);">
            <span class="text-3xl">📹</span>
          </div>
          <p class="text-sm font-bold text-gray-800">拍摄视频</p>
          <p class="text-[10px] text-gray-400 mt-1">即刻拍摄精彩瞬间</p>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm text-center">
          <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3" style="background: linear-gradient(135deg, #3B82F6, #60A5FA);">
            <span class="text-3xl">📁</span>
          </div>
          <p class="text-sm font-bold text-gray-800">上传视频</p>
          <p class="text-[10px] text-gray-400 mt-1">从相册选择视频</p>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm text-center">
          <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3" style="background: linear-gradient(135deg, #10B981, #34D399);">
            <span class="text-3xl">📷</span>
          </div>
          <p class="text-sm font-bold text-gray-800">拍照发布</p>
          <p class="text-[10px] text-gray-400 mt-1">用图片记录生活</p>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm text-center">
          <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3" style="background: linear-gradient(135deg, #F59E0B, #FBBF24);">
            <span class="text-3xl">🎬</span>
          </div>
          <p class="text-sm font-bold text-gray-800">模板创作</p>
          <p class="text-[10px] text-gray-400 mt-1">一键套用热门模板</p>
        </div>
      </div>

      <!-- 创作数据 -->
      <div class="mx-5 mt-5 bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-bold text-gray-800">我的创作数据</span>
          <span class="text-xs text-primary">详细 ›</span>
        </div>
        <div class="grid grid-cols-4 gap-3 text-center">
          <div>
            <p class="text-xl font-bold text-gray-800">26</p>
            <p class="text-[10px] text-gray-400 mt-0.5">作品</p>
          </div>
          <div>
            <p class="text-xl font-bold text-primary">58.6k</p>
            <p class="text-[10px] text-gray-400 mt-0.5">播放量</p>
          </div>
          <div>
            <p class="text-xl font-bold text-gray-800">3,280</p>
            <p class="text-[10px] text-gray-400 mt-0.5">点赞</p>
          </div>
          <div>
            <p class="text-xl font-bold text-gray-800">856</p>
            <p class="text-[10px] text-gray-400 mt-0.5">粉丝</p>
          </div>
        </div>
      </div>

      <!-- 热门模板 -->
      <div class="mx-5 mt-5 mb-4">
        <div class="flex justify-between items-center mb-3">
          <span class="text-base font-bold text-gray-800">热门模板</span>
          <span class="text-xs text-gray-400">更多 ›</span>
        </div>
        <div class="flex gap-3 overflow-x-auto pb-1">
          <div class="w-28 shrink-0 rounded-2xl overflow-hidden bg-white shadow-sm">
            <div class="h-36 flex items-center justify-center" style="background: linear-gradient(135deg, #EC4899, #F472B6);"><span class="text-4xl">✨</span></div>
            <div class="p-2">
              <p class="text-[11px] font-medium text-gray-800">闪光特效</p>
              <p class="text-[10px] text-gray-400">2.8k 人使用</p>
            </div>
          </div>
          <div class="w-28 shrink-0 rounded-2xl overflow-hidden bg-white shadow-sm">
            <div class="h-36 flex items-center justify-center" style="background: linear-gradient(135deg, #6366F1, #818CF8);"><span class="text-4xl">🎭</span></div>
            <div class="p-2">
              <p class="text-[11px] font-medium text-gray-800">变装秀</p>
              <p class="text-[10px] text-gray-400">5.2k 人使用</p>
            </div>
          </div>
          <div class="w-28 shrink-0 rounded-2xl overflow-hidden bg-white shadow-sm">
            <div class="h-36 flex items-center justify-center" style="background: linear-gradient(135deg, #14B8A6, #2DD4BF);"><span class="text-4xl">🎵</span></div>
            <div class="p-2">
              <p class="text-[11px] font-medium text-gray-800">卡点节拍</p>
              <p class="text-[10px] text-gray-400">8.6k 人使用</p>
            </div>
          </div>
        </div>
      </div>
      <div class="h-4"></div>
    </main>

    <nav class="border-t bg-white safe-area-bottom">
      <div class="flex justify-around py-1.5">
        <a href="01-index.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="home" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">首页</span></a>
        <a href="02-discover.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="compass" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">发现</span></a>
        <a href="03-create.html" class="flex flex-col items-center gap-0.5 min-w-[56px] py-1 no-underline">
          <div class="w-10 h-7 rounded-lg flex items-center justify-center relative">
            <div class="absolute w-8 h-6 rounded bg-cyan-400 left-0.5"></div>
            <div class="absolute w-8 h-6 rounded bg-primary right-0.5"></div>
            <div class="absolute w-8 h-6 rounded bg-black flex items-center justify-center"><i data-lucide="plus" class="w-4 h-4 text-white"></i></div>
          </div>
        </a>
        <a href="05-message.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="message-square" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">消息</span></a>
        <a href="04-my.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="user" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">我的</span></a>
      </div>
      <div class="home-indicator"></div>
    </nav>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>

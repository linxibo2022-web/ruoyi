<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>医疗健康 - 预约挂号</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#0EA5E9',
        'primary-dark': '#0284C7',
        'primary-light': '#E0F2FE',
      }
    }
  }
}
</script>
<style>
  body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 375px; height: 812px; background: #F8FAFC; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.3); border: 8px solid #2a2a3e; }
  .phone-content { height: 100%; overflow-y: auto; padding-bottom: 80px; }
  .phone-content::-webkit-scrollbar { display: none; }
  .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #E2E8F0; display: flex; padding: 8px 0 20px; z-index: 50; }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #94A3B8; font-size: 10px; }
  .tab-item.active { color: #0EA5E9; }
  .tab-item i { width: 24px; height: 24px; }
  .scroll-h { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .scroll-h::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-content">
    <!-- 顶部 -->
    <div class="bg-primary pt-12 pb-5 px-4">
      <div class="text-center text-base font-semibold text-white mb-4">预约挂号</div>
      <!-- 搜索栏 -->
      <div class="bg-white/20 backdrop-blur rounded-full px-4 py-2.5 flex items-center gap-2">
        <i data-lucide="search" class="w-4 h-4 text-white/70"></i>
        <span class="text-white/70 text-sm">搜索医院或科室</span>
      </div>
    </div>

    <!-- 热门科室横向滚动 -->
    <div class="px-4 pt-4 pb-2">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-semibold text-gray-800">热门科室</span>
        <span class="text-xs text-primary">全部 ›</span>
      </div>
      <div class="scroll-h">
        <div class="flex-shrink-0 bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl px-4 py-3 text-center min-w-[80px]">
          <div class="text-lg mb-1">🫀</div>
          <div class="text-xs text-gray-700 font-medium">心内科</div>
        </div>
        <div class="flex-shrink-0 bg-gradient-to-br from-red-50 to-red-100 rounded-xl px-4 py-3 text-center min-w-[80px]">
          <div class="text-lg mb-1">🦴</div>
          <div class="text-xs text-gray-700 font-medium">骨科</div>
        </div>
        <div class="flex-shrink-0 bg-gradient-to-br from-pink-50 to-pink-100 rounded-xl px-4 py-3 text-center min-w-[80px]">
          <div class="text-lg mb-1">👶</div>
          <div class="text-xs text-gray-700 font-medium">儿科</div>
        </div>
        <div class="flex-shrink-0 bg-gradient-to-br from-purple-50 to-purple-100 rounded-xl px-4 py-3 text-center min-w-[80px]">
          <div class="text-lg mb-1">🧠</div>
          <div class="text-xs text-gray-700 font-medium">神经内科</div>
        </div>
        <div class="flex-shrink-0 bg-gradient-to-br from-green-50 to-green-100 rounded-xl px-4 py-3 text-center min-w-[80px]">
          <div class="text-lg mb-1">👁️</div>
          <div class="text-xs text-gray-700 font-medium">眼科</div>
        </div>
        <div class="flex-shrink-0 bg-gradient-to-br from-amber-50 to-amber-100 rounded-xl px-4 py-3 text-center min-w-[80px]">
          <div class="text-lg mb-1">🦷</div>
          <div class="text-xs text-gray-700 font-medium">口腔科</div>
        </div>
      </div>
    </div>

    <!-- 附近医院列表 -->
    <div class="px-4 pt-2">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-semibold text-gray-800">附近医院</span>
        <div class="flex items-center gap-1 text-xs text-gray-400">
          <i data-lucide="map-pin" class="w-3 h-3"></i>
          <span>杭州市</span>
        </div>
      </div>

      <!-- 医院1 -->
      <div class="bg-white rounded-2xl p-4 mb-3 shadow-sm">
        <div class="flex gap-3">
          <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-blue-100 to-cyan-100 flex items-center justify-center text-3xl flex-shrink-0">🏥</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-medium text-sm text-gray-800 truncate">浙江大学附属第一医院</span>
            </div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-xs bg-red-50 text-red-500 px-1.5 py-0.5 rounded font-medium">三甲</span>
              <span class="text-xs text-gray-400">距离 1.2km</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-xs text-gray-500">42 个科室</span>
              <span class="text-xs bg-green-50 text-green-600 px-2 py-0.5 rounded-full">可预约</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 医院2 -->
      <div class="bg-white rounded-2xl p-4 mb-3 shadow-sm">
        <div class="flex gap-3">
          <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-green-100 to-emerald-100 flex items-center justify-center text-3xl flex-shrink-0">🏥</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-medium text-sm text-gray-800 truncate">杭州市第一人民医院</span>
            </div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-xs bg-red-50 text-red-500 px-1.5 py-0.5 rounded font-medium">三甲</span>
              <span class="text-xs text-gray-400">距离 2.5km</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-xs text-gray-500">38 个科室</span>
              <span class="text-xs bg-green-50 text-green-600 px-2 py-0.5 rounded-full">可预约</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 医院3 -->
      <div class="bg-white rounded-2xl p-4 mb-3 shadow-sm">
        <div class="flex gap-3">
          <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-purple-100 to-violet-100 flex items-center justify-center text-3xl flex-shrink-0">🏥</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-medium text-sm text-gray-800 truncate">浙江省中医院</span>
            </div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-xs bg-red-50 text-red-500 px-1.5 py-0.5 rounded font-medium">三甲</span>
              <span class="text-xs text-gray-400">距离 3.1km</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-xs text-gray-500">35 个科室</span>
              <span class="text-xs bg-green-50 text-green-600 px-2 py-0.5 rounded-full">可预约</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 医院4 -->
      <div class="bg-white rounded-2xl p-4 mb-3 shadow-sm">
        <div class="flex gap-3">
          <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-amber-100 to-orange-100 flex items-center justify-center text-3xl flex-shrink-0">🏥</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-medium text-sm text-gray-800 truncate">杭州市儿童医院</span>
            </div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-xs bg-orange-50 text-orange-500 px-1.5 py-0.5 rounded font-medium">三乙</span>
              <span class="text-xs text-gray-400">距离 4.8km</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-xs text-gray-500">18 个科室</span>
              <span class="text-xs bg-amber-50 text-amber-600 px-2 py-0.5 rounded-full">号源紧张</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 医院5 -->
      <div class="bg-white rounded-2xl p-4 mb-16 shadow-sm">
        <div class="flex gap-3">
          <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-teal-100 to-cyan-100 flex items-center justify-center text-3xl flex-shrink-0">🏥</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-medium text-sm text-gray-800 truncate">浙江大学附属邵逸夫医院</span>
            </div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-xs bg-red-50 text-red-500 px-1.5 py-0.5 rounded font-medium">三甲</span>
              <span class="text-xs text-gray-400">距离 5.3km</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-xs text-gray-500">40 个科室</span>
              <span class="text-xs bg-green-50 text-green-600 px-2 py-0.5 rounded-full">可预约</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部Tab栏 -->
  <div class="tab-bar">
    <a href="01-index.html" class="tab-item">
      <i data-lucide="home"></i>
      <span>首页</span>
    </a>
    <a href="02-consult.html" class="tab-item">
      <i data-lucide="stethoscope"></i>
      <span>问诊</span>
    </a>
    <a href="03-booking.html" class="tab-item active">
      <i data-lucide="calendar-check"></i>
      <span>预约</span>
    </a>
    <a href="04-my.html" class="tab-item">
      <i data-lucide="user"></i>
      <span>我的</span>
    </a>
  </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>

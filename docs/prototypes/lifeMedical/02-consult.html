<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>医疗健康 - 问诊</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#0EA5E9',
        'primary-dark': '#0284C7',
        'primary-light': '#E0F2FE',
      }
    }
  }
}
</script>
<style>
  body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 375px; height: 812px; background: #F8FAFC; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.3); border: 8px solid #2a2a3e; }
  .phone-content { height: 100%; overflow-y: auto; padding-bottom: 80px; }
  .phone-content::-webkit-scrollbar { display: none; }
  .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #E2E8F0; display: flex; padding: 8px 0 20px; z-index: 50; }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #94A3B8; font-size: 10px; }
  .tab-item.active { color: #0EA5E9; }
  .tab-item i { width: 24px; height: 24px; }
  .consult-tab { cursor: pointer; padding: 8px 16px; font-size: 14px; color: #94A3B8; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .consult-tab.active { color: #0EA5E9; border-bottom-color: #0EA5E9; font-weight: 600; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-content">
    <!-- 顶部 -->
    <div class="bg-white pt-12 pb-0 px-4">
      <div class="text-center text-base font-semibold text-gray-800 mb-4">在线问诊</div>
      <!-- Tab切换 -->
      <div class="flex justify-center gap-2 border-b border-gray-100">
        <div class="consult-tab active">图文问诊</div>
        <div class="consult-tab">视频问诊</div>
        <div class="consult-tab">电话问诊</div>
      </div>
    </div>

    <!-- 选择科室 -->
    <div class="px-4 pt-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-semibold text-gray-800">选择科室</span>
        <span class="text-xs text-primary">全部科室 ›</span>
      </div>
      <div class="grid grid-cols-4 gap-3 mb-4">
        <div class="bg-white rounded-xl p-3 flex flex-col items-center gap-1.5 shadow-sm">
          <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center">
            <i data-lucide="heart-pulse" class="w-5 h-5 text-blue-500"></i>
          </div>
          <span class="text-xs text-gray-600">内科</span>
        </div>
        <div class="bg-white rounded-xl p-3 flex flex-col items-center gap-1.5 shadow-sm">
          <div class="w-10 h-10 bg-red-50 rounded-xl flex items-center justify-center">
            <i data-lucide="syringe" class="w-5 h-5 text-red-500"></i>
          </div>
          <span class="text-xs text-gray-600">外科</span>
        </div>
        <div class="bg-white rounded-xl p-3 flex flex-col items-center gap-1.5 shadow-sm">
          <div class="w-10 h-10 bg-pink-50 rounded-xl flex items-center justify-center">
            <i data-lucide="baby" class="w-5 h-5 text-pink-500"></i>
          </div>
          <span class="text-xs text-gray-600">妇科</span>
        </div>
        <div class="bg-white rounded-xl p-3 flex flex-col items-center gap-1.5 shadow-sm">
          <div class="w-10 h-10 bg-amber-50 rounded-xl flex items-center justify-center">
            <i data-lucide="smile" class="w-5 h-5 text-amber-500"></i>
          </div>
          <span class="text-xs text-gray-600">儿科</span>
        </div>
        <div class="bg-white rounded-xl p-3 flex flex-col items-center gap-1.5 shadow-sm">
          <div class="w-10 h-10 bg-purple-50 rounded-xl flex items-center justify-center">
            <i data-lucide="scan-face" class="w-5 h-5 text-purple-500"></i>
          </div>
          <span class="text-xs text-gray-600">皮肤科</span>
        </div>
        <div class="bg-white rounded-xl p-3 flex flex-col items-center gap-1.5 shadow-sm">
          <div class="w-10 h-10 bg-cyan-50 rounded-xl flex items-center justify-center">
            <i data-lucide="eye" class="w-5 h-5 text-cyan-500"></i>
          </div>
          <span class="text-xs text-gray-600">眼科</span>
        </div>
        <div class="bg-white rounded-xl p-3 flex flex-col items-center gap-1.5 shadow-sm">
          <div class="w-10 h-10 bg-green-50 rounded-xl flex items-center justify-center">
            <i data-lucide="radiation" class="w-5 h-5 text-green-500"></i>
          </div>
          <span class="text-xs text-gray-600">口腔科</span>
        </div>
        <div class="bg-white rounded-xl p-3 flex flex-col items-center gap-1.5 shadow-sm">
          <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center">
            <i data-lucide="grid-3x3" class="w-5 h-5 text-gray-500"></i>
          </div>
          <span class="text-xs text-gray-600">更多</span>
        </div>
      </div>
    </div>

    <!-- 在线医生列表 -->
    <div class="px-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-semibold text-gray-800">在线医生</span>
        <div class="flex items-center gap-1 text-xs text-gray-400">
          <i data-lucide="filter" class="w-3 h-3"></i>
          <span>筛选</span>
        </div>
      </div>

      <!-- 医生1 -->
      <div class="bg-white rounded-2xl p-4 mb-3 shadow-sm">
        <div class="flex gap-3">
          <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-blue-100 to-blue-200 flex items-center justify-center text-2xl flex-shrink-0">👨‍⚕️</div>
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-medium text-sm text-gray-800">张伟明</span>
              <span class="text-xs bg-primary/10 text-primary px-1.5 py-0.5 rounded">主任医师</span>
              <span class="text-xs bg-green-50 text-green-600 px-1.5 py-0.5 rounded flex items-center gap-0.5">
                <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>在线
              </span>
            </div>
            <div class="text-xs text-gray-500 mb-2">擅长：冠心病、高血压、心律失常的诊治</div>
            <div class="flex items-center justify-between">
              <span class="text-primary font-semibold text-sm">¥68 <span class="text-xs text-gray-400 font-normal">/次</span></span>
              <button class="bg-primary text-white text-xs px-4 py-1.5 rounded-full font-medium">立即咨询</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 医生2 -->
      <div class="bg-white rounded-2xl p-4 mb-3 shadow-sm">
        <div class="flex gap-3">
          <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-pink-100 to-pink-200 flex items-center justify-center text-2xl flex-shrink-0">👩‍⚕️</div>
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-medium text-sm text-gray-800">李雅琴</span>
              <span class="text-xs bg-primary/10 text-primary px-1.5 py-0.5 rounded">副主任医师</span>
              <span class="text-xs bg-green-50 text-green-600 px-1.5 py-0.5 rounded flex items-center gap-0.5">
                <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>在线
              </span>
            </div>
            <div class="text-xs text-gray-500 mb-2">擅长：小儿感冒、发热、哮喘、过敏性疾病</div>
            <div class="flex items-center justify-between">
              <span class="text-primary font-semibold text-sm">¥45 <span class="text-xs text-gray-400 font-normal">/次</span></span>
              <button class="bg-primary text-white text-xs px-4 py-1.5 rounded-full font-medium">立即咨询</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 医生3 -->
      <div class="bg-white rounded-2xl p-4 mb-3 shadow-sm">
        <div class="flex gap-3">
          <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-purple-100 to-purple-200 flex items-center justify-center text-2xl flex-shrink-0">👩‍⚕️</div>
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-medium text-sm text-gray-800">王晓燕</span>
              <span class="text-xs bg-primary/10 text-primary px-1.5 py-0.5 rounded">主任医师</span>
              <span class="text-xs bg-gray-50 text-gray-500 px-1.5 py-0.5 rounded flex items-center gap-0.5">
                <span class="w-1.5 h-1.5 bg-gray-400 rounded-full"></span>忙碌
              </span>
            </div>
            <div class="text-xs text-gray-500 mb-2">擅长：湿疹、荨麻疹、痤疮、银屑病诊治</div>
            <div class="flex items-center justify-between">
              <span class="text-primary font-semibold text-sm">¥58 <span class="text-xs text-gray-400 font-normal">/次</span></span>
              <button class="bg-gray-200 text-gray-500 text-xs px-4 py-1.5 rounded-full font-medium">排队中</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 医生4 -->
      <div class="bg-white rounded-2xl p-4 mb-16 shadow-sm">
        <div class="flex gap-3">
          <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-green-100 to-green-200 flex items-center justify-center text-2xl flex-shrink-0">👨‍⚕️</div>
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-medium text-sm text-gray-800">陈建国</span>
              <span class="text-xs bg-primary/10 text-primary px-1.5 py-0.5 rounded">主治医师</span>
              <span class="text-xs bg-green-50 text-green-600 px-1.5 py-0.5 rounded flex items-center gap-0.5">
                <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>在线
              </span>
            </div>
            <div class="text-xs text-gray-500 mb-2">擅长：骨折、关节置换、脊柱疾病微创手术</div>
            <div class="flex items-center justify-between">
              <span class="text-primary font-semibold text-sm">¥55 <span class="text-xs text-gray-400 font-normal">/次</span></span>
              <button class="bg-primary text-white text-xs px-4 py-1.5 rounded-full font-medium">立即咨询</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部Tab栏 -->
  <div class="tab-bar">
    <a href="01-index.html" class="tab-item">
      <i data-lucide="home"></i>
      <span>首页</span>
    </a>
    <a href="02-consult.html" class="tab-item active">
      <i data-lucide="stethoscope"></i>
      <span>问诊</span>
    </a>
    <a href="03-booking.html" class="tab-item">
      <i data-lucide="calendar-check"></i>
      <span>预约</span>
    </a>
    <a href="04-my.html" class="tab-item">
      <i data-lucide="user"></i>
      <span>我的</span>
    </a>
  </div>
</div>

<script>
lucide.createIcons();
document.querySelectorAll('.consult-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.consult-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});
</script>
</body>
</html>

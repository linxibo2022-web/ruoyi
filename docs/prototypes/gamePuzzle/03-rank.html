<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>益智游戏 - 排行</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#EC4899', 'primary-dark': '#DB2777' } } } }
  </script>
  <style>
    .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .status-bar { height: 44px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">
  <div class="phone-frame bg-gray-50 flex flex-col">
    <div class="status-bar bg-white">
      <span>9:41</span>
      <div class="flex items-center gap-1"><i data-lucide="signal" class="w-4 h-4"></i><i data-lucide="wifi" class="w-4 h-4"></i><i data-lucide="battery-full" class="w-4 h-4"></i></div>
    </div>

    <main class="flex-1 overflow-y-auto">
      <div class="bg-white px-5 pt-3 pb-4">
        <p class="text-2xl font-bold text-gray-800 mb-3">🏆 排行榜</p>
        <div class="flex gap-2">
          <span class="bg-primary text-white text-xs px-4 py-1.5 rounded-full font-medium">总积分</span>
          <span class="bg-gray-100 text-gray-600 text-xs px-4 py-1.5 rounded-full">拼图</span>
          <span class="bg-gray-100 text-gray-600 text-xs px-4 py-1.5 rounded-full">数独</span>
          <span class="bg-gray-100 text-gray-600 text-xs px-4 py-1.5 rounded-full">消消乐</span>
        </div>
      </div>

      <!-- 前三名 -->
      <div class="mx-5 mt-4 rounded-2xl p-5 relative overflow-hidden" style="background: linear-gradient(135deg, #EC4899, #DB2777);">
        <div class="absolute w-40 h-40 bg-white/10 rounded-full -top-8 -right-8"></div>
        <div class="absolute w-32 h-32 bg-white/10 rounded-full -bottom-12 right-12"></div>
        <div class="flex items-end justify-center gap-4 relative z-10">
          <!-- 第2名 -->
          <div class="text-center">
            <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-1" style="border: 2px solid rgba(255,255,255,0.5);"><span class="text-2xl">👩</span></div>
            <p class="text-white text-xs font-bold">小美</p>
            <div class="bg-white/20 rounded-full px-2 py-0.5 mt-1"><span class="text-white text-[10px] font-bold">18,650</span></div>
            <div class="w-14 h-16 rounded-t-xl mt-2 flex items-center justify-center" style="background: rgba(255,255,255,0.15);"><span class="text-white text-lg font-bold">2</span></div>
          </div>
          <!-- 第1名 -->
          <div class="text-center -mt-4">
            <span class="text-2xl block mb-1">👑</span>
            <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-1" style="border: 3px solid #FBBF24;"><span class="text-3xl">🧑</span></div>
            <p class="text-white text-sm font-bold">大神</p>
            <div class="bg-yellow-400/30 rounded-full px-2.5 py-0.5 mt-1"><span class="text-white text-xs font-bold">25,800</span></div>
            <div class="w-16 h-20 rounded-t-xl mt-2 flex items-center justify-center" style="background: rgba(255,255,255,0.2);"><span class="text-white text-xl font-bold">1</span></div>
          </div>
          <!-- 第3名 -->
          <div class="text-center">
            <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-1" style="border: 2px solid rgba(255,255,255,0.5);"><span class="text-2xl">👦</span></div>
            <p class="text-white text-xs font-bold">阿杰</p>
            <div class="bg-white/20 rounded-full px-2 py-0.5 mt-1"><span class="text-white text-[10px] font-bold">15,320</span></div>
            <div class="w-14 h-12 rounded-t-xl mt-2 flex items-center justify-center" style="background: rgba(255,255,255,0.15);"><span class="text-white text-lg font-bold">3</span></div>
          </div>
        </div>
      </div>

      <!-- 我的排名 -->
      <div class="mx-5 mt-4 bg-white rounded-2xl p-4 shadow-sm border-2 border-pink-200">
        <div class="flex items-center">
          <span class="w-8 h-8 rounded-full bg-primary text-white text-sm font-bold flex items-center justify-center mr-3">28</span>
          <div class="w-10 h-10 bg-pink-50 rounded-full flex items-center justify-center mr-3"><span class="text-xl">😊</span></div>
          <div class="flex-1">
            <p class="text-sm font-bold text-gray-800">我</p>
            <p class="text-[10px] text-gray-400">Lv.12 · 拼图达人</p>
          </div>
          <div class="text-right">
            <p class="text-base font-bold text-primary">2,580</p>
            <p class="text-[10px] text-gray-400">积分</p>
          </div>
        </div>
      </div>

      <!-- 排行列表 -->
      <div class="mx-5 mt-4 mb-4">
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
          <div class="flex items-center px-4 py-3.5 border-b border-gray-50">
            <span class="w-6 text-center text-sm font-bold text-gray-400 mr-3">4</span>
            <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center mr-3"><span class="text-xl">👧</span></div>
            <div class="flex-1">
              <p class="text-sm font-medium text-gray-800">小雨</p>
              <p class="text-[10px] text-gray-400">Lv.18</p>
            </div>
            <span class="text-sm font-bold text-gray-600">12,860</span>
          </div>
          <div class="flex items-center px-4 py-3.5 border-b border-gray-50">
            <span class="w-6 text-center text-sm font-bold text-gray-400 mr-3">5</span>
            <div class="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center mr-3"><span class="text-xl">👨</span></div>
            <div class="flex-1">
              <p class="text-sm font-medium text-gray-800">老王</p>
              <p class="text-[10px] text-gray-400">Lv.16</p>
            </div>
            <span class="text-sm font-bold text-gray-600">11,520</span>
          </div>
          <div class="flex items-center px-4 py-3.5 border-b border-gray-50">
            <span class="w-6 text-center text-sm font-bold text-gray-400 mr-3">6</span>
            <div class="w-10 h-10 bg-purple-50 rounded-full flex items-center justify-center mr-3"><span class="text-xl">👩‍🦰</span></div>
            <div class="flex-1">
              <p class="text-sm font-medium text-gray-800">小红</p>
              <p class="text-[10px] text-gray-400">Lv.15</p>
            </div>
            <span class="text-sm font-bold text-gray-600">10,350</span>
          </div>
          <div class="flex items-center px-4 py-3.5 border-b border-gray-50">
            <span class="w-6 text-center text-sm font-bold text-gray-400 mr-3">7</span>
            <div class="w-10 h-10 bg-amber-50 rounded-full flex items-center justify-center mr-3"><span class="text-xl">🧑‍💻</span></div>
            <div class="flex-1">
              <p class="text-sm font-medium text-gray-800">程序员</p>
              <p class="text-[10px] text-gray-400">Lv.14</p>
            </div>
            <span class="text-sm font-bold text-gray-600">9,880</span>
          </div>
          <div class="flex items-center px-4 py-3.5">
            <span class="w-6 text-center text-sm font-bold text-gray-400 mr-3">8</span>
            <div class="w-10 h-10 bg-red-50 rounded-full flex items-center justify-center mr-3"><span class="text-xl">👴</span></div>
            <div class="flex-1">
              <p class="text-sm font-medium text-gray-800">老李</p>
              <p class="text-[10px] text-gray-400">Lv.13</p>
            </div>
            <span class="text-sm font-bold text-gray-600">8,650</span>
          </div>
        </div>
      </div>
      <div class="h-4"></div>
    </main>

    <nav class="border-t bg-white safe-area-bottom">
      <div class="flex justify-around py-1.5">
        <a href="01-index.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="home" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">首页</span></a>
        <a href="02-game.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="gamepad-2" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">游戏</span></a>
        <a href="03-rank.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="trophy" class="w-5 h-5 text-primary"></i><span class="text-[10px] text-primary font-medium">排行</span></a>
        <a href="04-my.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="user" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">我的</span></a>
      </div>
      <div class="home-indicator"></div>
    </nav>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>

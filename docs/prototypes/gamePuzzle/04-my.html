<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>益智游戏 - 我的</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#EC4899', 'primary-dark': '#DB2777' } } } }
  </script>
  <style>
    .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .status-bar { height: 44px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">
  <div class="phone-frame bg-gray-50 flex flex-col">
    <div class="status-bar" style="background: linear-gradient(135deg, #EC4899, #DB2777);">
      <span class="text-white">9:41</span>
      <div class="flex items-center gap-1 text-white"><i data-lucide="signal" class="w-4 h-4"></i><i data-lucide="wifi" class="w-4 h-4"></i><i data-lucide="battery-full" class="w-4 h-4"></i></div>
    </div>

    <main class="flex-1 overflow-y-auto">
      <!-- 粉色渐变头部 -->
      <div class="relative overflow-hidden px-5 pt-5 pb-16" style="background: linear-gradient(135deg, #EC4899, #DB2777);">
        <div class="absolute w-48 h-48 rounded-full bg-white/10 -top-10 -right-10"></div>
        <div class="absolute w-40 h-40 rounded-full bg-white/10 -bottom-16 right-16"></div>
        <div class="absolute w-32 h-32 rounded-full bg-white/10 top-5 -left-10"></div>

        <div class="flex justify-between items-start relative z-10">
          <div class="flex gap-3 items-center">
            <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center" style="border: 3px solid rgba(255,255,255,0.4);"><span class="text-3xl">😊</span></div>
            <div>
              <p class="text-white text-lg font-bold">游戏玩家</p>
              <div class="flex gap-2 mt-1">
                <span class="bg-white/20 text-white text-[10px] px-2.5 py-0.5 rounded-full">Lv.12</span>
                <span class="bg-white/20 text-white text-[10px] px-2.5 py-0.5 rounded-full">拼图达人</span>
              </div>
            </div>
          </div>
          <button class="w-9 h-9 flex items-center justify-center"><i data-lucide="settings" class="w-5 h-5 text-white/80"></i></button>
        </div>
      </div>

      <!-- 游戏数据 -->
      <div class="mx-5 -mt-10 bg-white rounded-2xl p-5 shadow-sm relative z-20">
        <div class="grid grid-cols-4 gap-3 text-center">
          <div>
            <p class="text-lg font-bold text-gray-800">2,580</p>
            <p class="text-[10px] text-gray-400 mt-1">总积分</p>
          </div>
          <div>
            <p class="text-lg font-bold text-primary">128</p>
            <p class="text-[10px] text-gray-400 mt-1">通关数</p>
          </div>
          <div>
            <p class="text-lg font-bold text-amber-500">15</p>
            <p class="text-[10px] text-gray-400 mt-1">成就</p>
          </div>
          <div>
            <p class="text-lg font-bold text-gray-800">28</p>
            <p class="text-[10px] text-gray-400 mt-1">排名</p>
          </div>
        </div>
      </div>

      <!-- 游戏记录 -->
      <div class="mx-5 mt-5 bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-semibold text-gray-800">最近游戏</span>
          <span class="text-xs text-primary">查看全部 ›</span>
        </div>
        <div class="space-y-3">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #EC4899, #F472B6);"><span class="text-xl">🧩</span></div>
            <div class="flex-1">
              <p class="text-sm font-medium text-gray-800">经典拼图</p>
              <p class="text-[10px] text-gray-400">4×4 · 用时 2:35 · 今天</p>
            </div>
            <div class="bg-pink-50 text-primary text-xs px-2.5 py-0.5 rounded-full font-bold">+120</div>
          </div>
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #8B5CF6, #A78BFA);"><span class="text-xl">🔢</span></div>
            <div class="flex-1">
              <p class="text-sm font-medium text-gray-800">数独大师</p>
              <p class="text-[10px] text-gray-400">中等难度 · 用时 8:12 · 昨天</p>
            </div>
            <div class="bg-purple-50 text-purple-500 text-xs px-2.5 py-0.5 rounded-full font-bold">+200</div>
          </div>
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #3B82F6, #60A5FA);"><span class="text-xl">🎯</span></div>
            <div class="flex-1">
              <p class="text-sm font-medium text-gray-800">消消乐</p>
              <p class="text-[10px] text-gray-400">第 86 关 · 3星通过 · 昨天</p>
            </div>
            <div class="bg-blue-50 text-blue-500 text-xs px-2.5 py-0.5 rounded-full font-bold">+150</div>
          </div>
        </div>
      </div>

      <!-- 成就徽章 -->
      <div class="mx-5 mt-5 bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-semibold text-gray-800">成就徽章</span>
          <span class="text-xs text-gray-400">15/50</span>
        </div>
        <div class="grid grid-cols-4 gap-3 text-center">
          <div>
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto" style="background: linear-gradient(135deg, #FEF3C7, #FDE68A);"><span class="text-2xl">🏅</span></div>
            <p class="text-[10px] text-gray-600 mt-1">初出茅庐</p>
          </div>
          <div>
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto" style="background: linear-gradient(135deg, #FCE7F3, #FBCFE8);"><span class="text-2xl">🧩</span></div>
            <p class="text-[10px] text-gray-600 mt-1">拼图达人</p>
          </div>
          <div>
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto" style="background: linear-gradient(135deg, #EEF2FF, #E0E7FF);"><span class="text-2xl">⚡</span></div>
            <p class="text-[10px] text-gray-600 mt-1">闪电手</p>
          </div>
          <div>
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto bg-gray-100"><span class="text-2xl opacity-30">🔒</span></div>
            <p class="text-[10px] text-gray-400 mt-1">未解锁</p>
          </div>
        </div>
      </div>

      <!-- 功能菜单 -->
      <div class="mx-5 mt-5 mb-4 bg-white rounded-2xl overflow-hidden shadow-sm">
        <div class="flex items-center px-5 py-3.5 border-b border-gray-50">
          <div class="w-9 h-9 rounded-xl bg-pink-50 flex items-center justify-center mr-3"><span class="text-lg">⭐</span></div>
          <span class="flex-1 text-sm text-gray-700">积分商城</span>
          <span class="text-[11px] text-primary mr-2">2,580可用</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="flex items-center px-5 py-3.5 border-b border-gray-50">
          <div class="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center mr-3"><span class="text-lg">👥</span></div>
          <span class="flex-1 text-sm text-gray-700">邀请好友</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="flex items-center px-5 py-3.5 border-b border-gray-50">
          <div class="w-9 h-9 rounded-xl bg-green-50 flex items-center justify-center mr-3"><span class="text-lg">📋</span></div>
          <span class="flex-1 text-sm text-gray-700">游戏规则</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="flex items-center px-5 py-3.5">
          <div class="w-9 h-9 rounded-xl bg-gray-50 flex items-center justify-center mr-3"><span class="text-lg">💬</span></div>
          <span class="flex-1 text-sm text-gray-700">意见反馈</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
      </div>
      <div class="h-4"></div>
    </main>

    <nav class="border-t bg-white safe-area-bottom">
      <div class="flex justify-around py-1.5">
        <a href="01-index.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="home" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">首页</span></a>
        <a href="02-game.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="gamepad-2" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">游戏</span></a>
        <a href="03-rank.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="trophy" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">排行</span></a>
        <a href="04-my.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="user" class="w-5 h-5 text-primary"></i><span class="text-[10px] text-primary font-medium">我的</span></a>
      </div>
      <div class="home-indicator"></div>
    </nav>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>

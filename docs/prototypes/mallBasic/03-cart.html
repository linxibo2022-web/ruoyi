<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>基础商城 - 购物车</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#FF6B35', 'primary-light': '#FFF3ED', accent: '#1A1A2E' } } }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .status-bar { height: 44px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    a { text-decoration: none; color: inherit; }
    .qty-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 1px solid #e5e5e5; border-radius: 6px; font-size: 14px; color: #333; background: #fff; cursor: pointer; }
    .qty-input { width: 36px; height: 28px; text-align: center; font-size: 13px; border: none; outline: none; background: transparent; }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">

  <div class="phone-frame bg-gray-50 flex flex-col">

    <div class="status-bar bg-white">
      <span>9:41</span>
      <div class="flex items-center gap-1">
        <i data-lucide="signal" class="w-4 h-4"></i>
        <i data-lucide="wifi" class="w-4 h-4"></i>
        <i data-lucide="battery-full" class="w-4 h-4"></i>
      </div>
    </div>

    <!-- 顶部导航 -->
    <div class="h-11 flex items-center justify-between px-4 bg-white border-b border-gray-100">
      <span class="font-bold text-base">购物车<span class="text-gray-400 font-normal text-sm ml-1">(3)</span></span>
      <span class="text-sm text-gray-500">管理</span>
    </div>

    <!-- 购物车列表 -->
    <main class="flex-1 overflow-y-auto hide-scrollbar pb-[120px]">

      <!-- 店铺分组 -->
      <div class="mx-4 mt-3 bg-white rounded-2xl overflow-hidden">
        <!-- 店铺头 -->
        <div class="flex items-center px-4 py-3 border-b border-gray-50">
          <div class="w-5 h-5 rounded border-2 border-primary flex items-center justify-center mr-2.5 bg-primary">
            <i data-lucide="check" class="w-3 h-3 text-white"></i>
          </div>
          <i data-lucide="store" class="w-4 h-4 text-gray-500 mr-1.5"></i>
          <span class="text-sm font-medium">Apple 官方旗舰店</span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-400 ml-1"></i>
        </div>

        <!-- 商品项 1 -->
        <a href="05-detail.html" class="flex p-4 border-b border-gray-50 block">
          <div class="w-5 h-5 rounded border-2 border-primary flex items-center justify-center mr-3 mt-5 flex-shrink-0 bg-primary">
            <i data-lucide="check" class="w-3 h-3 text-white"></i>
          </div>
          <div class="w-[88px] h-[88px] rounded-xl bg-gray-100 overflow-hidden flex-shrink-0">
            <img src="https://picsum.photos/176/176?random=11" class="w-full h-full object-cover" alt="">
          </div>
          <div class="ml-3 flex-1 flex flex-col justify-between min-h-[88px]">
            <div>
              <div class="text-[13px] font-medium leading-snug line-clamp-2 text-gray-800">iPhone 15 Pro Max 512GB 钛金属</div>
              <div class="mt-1">
                <span class="text-[10px] text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded">原色钛金属</span>
              </div>
            </div>
            <div class="flex items-end justify-between">
              <span class="text-primary font-bold text-base">¥8,999</span>
              <div class="flex items-center gap-1">
                <button class="qty-btn">-</button>
                <input type="text" value="1" class="qty-input" readonly>
                <button class="qty-btn">+</button>
              </div>
            </div>
          </div>
        </a>

        <!-- 商品项 2 -->
        <a href="05-detail.html" class="flex p-4 block">
          <div class="w-5 h-5 rounded border-2 border-primary flex items-center justify-center mr-3 mt-5 flex-shrink-0 bg-primary">
            <i data-lucide="check" class="w-3 h-3 text-white"></i>
          </div>
          <div class="w-[88px] h-[88px] rounded-xl bg-gray-100 overflow-hidden flex-shrink-0">
            <img src="https://picsum.photos/176/176?random=12" class="w-full h-full object-cover" alt="">
          </div>
          <div class="ml-3 flex-1 flex flex-col justify-between min-h-[88px]">
            <div>
              <div class="text-[13px] font-medium leading-snug line-clamp-2 text-gray-800">MacBook Pro 14 M3 Pro 芯片</div>
              <div class="mt-1">
                <span class="text-[10px] text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded">深空灰</span>
              </div>
            </div>
            <div class="flex items-end justify-between">
              <span class="text-primary font-bold text-base">¥17,999</span>
              <div class="flex items-center gap-1">
                <button class="qty-btn">-</button>
                <input type="text" value="1" class="qty-input" readonly>
                <button class="qty-btn">+</button>
              </div>
            </div>
          </div>
        </a>
      </div>

      <!-- 失效商品 -->
      <div class="mx-4 mt-3 bg-white rounded-2xl overflow-hidden">
        <div class="flex items-center px-4 py-3 border-b border-gray-50">
          <span class="text-sm text-gray-400">失效商品 (1)</span>
          <span class="text-sm text-gray-400 ml-auto">清空</span>
        </div>
        <div class="flex p-4 opacity-50">
          <div class="w-5 h-5 rounded border-2 border-gray-300 mr-3 mt-5 flex-shrink-0"></div>
          <div class="w-[88px] h-[88px] rounded-xl bg-gray-100 overflow-hidden flex-shrink-0 relative">
            <img src="https://picsum.photos/176/176?random=16" class="w-full h-full object-cover" alt="">
            <div class="absolute inset-0 bg-black/30 flex items-center justify-center rounded-xl">
              <span class="text-white text-[10px] font-medium">已失效</span>
            </div>
          </div>
          <div class="ml-3 flex-1 flex flex-col justify-between min-h-[88px]">
            <div class="text-[13px] leading-snug line-clamp-2 text-gray-500">iPhone 14 Pro 深空黑色 256GB</div>
            <span class="text-gray-400 text-sm">¥7,599</span>
          </div>
        </div>
      </div>

      <!-- 猜你喜欢 -->
      <div class="mx-4 mt-4 mb-4">
        <div class="text-center text-sm text-gray-400 mb-3">- 猜你喜欢 -</div>
        <div class="grid grid-cols-2 gap-2.5">
          <a href="05-detail.html" class="bg-white rounded-2xl overflow-hidden block">
            <img src="https://picsum.photos/350/350?random=51" class="w-full aspect-square object-cover" alt="">
            <div class="p-3">
              <div class="text-[13px] font-medium line-clamp-2 text-gray-800">Apple Watch S9 GPS</div>
              <span class="text-primary font-bold text-sm mt-1 block">¥2,999</span>
            </div>
          </a>
          <a href="05-detail.html" class="bg-white rounded-2xl overflow-hidden block">
            <img src="https://picsum.photos/350/350?random=52" class="w-full aspect-square object-cover" alt="">
            <div class="p-3">
              <div class="text-[13px] font-medium line-clamp-2 text-gray-800">AirPods Pro 2 代</div>
              <span class="text-primary font-bold text-sm mt-1 block">¥1,899</span>
            </div>
          </a>
        </div>
      </div>

    </main>

    <!-- 底部结算栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 safe-area-bottom" style="position: absolute;">
      <div class="flex items-center px-4 py-3">
        <!-- 全选 -->
        <div class="flex items-center mr-3">
          <div class="w-5 h-5 rounded border-2 border-primary flex items-center justify-center bg-primary">
            <i data-lucide="check" class="w-3 h-3 text-white"></i>
          </div>
          <span class="text-sm text-gray-600 ml-2">全选</span>
        </div>
        <!-- 合计 -->
        <div class="flex-1 text-right mr-3">
          <div class="text-sm text-gray-500">合计: <span class="text-primary font-bold text-lg">¥26,998</span></div>
          <div class="text-[10px] text-gray-400">已优惠 ¥2,000</div>
        </div>
        <!-- 结算按钮 -->
        <a href="06-order-confirm.html" class="bg-primary text-white text-sm font-medium px-6 py-2.5 rounded-full block">结算(2)</a>
      </div>
      <div class="home-indicator"></div>
    </div>

  </div>

  <script>lucide.createIcons();</script>
</body>
</html>

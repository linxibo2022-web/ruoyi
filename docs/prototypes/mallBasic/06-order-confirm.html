<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>基础商城 - 确认订单</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#FF6B35', 'primary-light': '#FFF3ED', accent: '#1A1A2E' } } }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .status-bar { height: 44px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">

  <div class="phone-frame bg-gray-50 flex flex-col">

    <div class="status-bar bg-white">
      <span>9:41</span>
      <div class="flex items-center gap-1">
        <i data-lucide="signal" class="w-4 h-4"></i>
        <i data-lucide="wifi" class="w-4 h-4"></i>
        <i data-lucide="battery-full" class="w-4 h-4"></i>
      </div>
    </div>

    <!-- 顶部导航 -->
    <div class="h-11 flex items-center justify-between px-4 bg-white border-b border-gray-100">
      <a href="03-cart.html" class="w-8 h-8 flex items-center justify-center">
        <i data-lucide="arrow-left" class="w-5 h-5 text-gray-700"></i>
      </a>
      <span class="font-medium text-base">确认订单</span>
      <div class="w-8 h-8"></div>
    </div>

    <main class="flex-1 overflow-y-auto hide-scrollbar">

      <!-- 收货地址 -->
      <div class="mx-4 mt-3 bg-white rounded-2xl p-4">
        <div class="flex items-start">
          <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0 mt-0.5">
            <i data-lucide="map-pin" class="w-4 h-4 text-primary"></i>
          </div>
          <div class="ml-3 flex-1">
            <div class="flex items-center gap-2">
              <span class="text-sm font-medium">张三</span>
              <span class="text-sm text-gray-500">138****8000</span>
            </div>
            <p class="text-xs text-gray-500 mt-1 leading-relaxed">浙江省杭州市西湖区文一西路 969 号阿里巴巴西溪园区</p>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 mt-1 flex-shrink-0"></i>
        </div>
      </div>

      <!-- 彩色分割线 -->
      <div class="mx-4 h-1 bg-gradient-to-r from-primary via-yellow-400 to-green-400 rounded-full -mt-0.5"></div>

      <!-- 商品信息 -->
      <div class="mx-4 mt-3 bg-white rounded-2xl overflow-hidden">
        <div class="flex items-center px-4 py-3 border-b border-gray-50">
          <i data-lucide="store" class="w-4 h-4 text-gray-500 mr-1.5"></i>
          <span class="text-sm font-medium">Apple 官方旗舰店</span>
        </div>

        <!-- 商品项 1 -->
        <div class="flex p-4 border-b border-gray-50">
          <div class="w-[76px] h-[76px] rounded-xl bg-gray-100 overflow-hidden flex-shrink-0">
            <img src="https://picsum.photos/152/152?random=11" class="w-full h-full object-cover" alt="">
          </div>
          <div class="ml-3 flex-1 flex flex-col justify-between">
            <div class="text-[13px] font-medium leading-snug line-clamp-2 text-gray-800">iPhone 15 Pro Max 512GB 钛金属</div>
            <div class="flex items-end justify-between">
              <span class="text-[11px] text-gray-400">原色钛金属 / 512GB</span>
              <div class="text-right">
                <span class="text-sm font-bold text-gray-800">¥8,999</span>
                <span class="text-[11px] text-gray-400 ml-1">x1</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 商品项 2 -->
        <div class="flex p-4">
          <div class="w-[76px] h-[76px] rounded-xl bg-gray-100 overflow-hidden flex-shrink-0">
            <img src="https://picsum.photos/152/152?random=12" class="w-full h-full object-cover" alt="">
          </div>
          <div class="ml-3 flex-1 flex flex-col justify-between">
            <div class="text-[13px] font-medium leading-snug line-clamp-2 text-gray-800">MacBook Pro 14 M3 Pro 芯片</div>
            <div class="flex items-end justify-between">
              <span class="text-[11px] text-gray-400">深空灰 / 标准版</span>
              <div class="text-right">
                <span class="text-sm font-bold text-gray-800">¥17,999</span>
                <span class="text-[11px] text-gray-400 ml-1">x1</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 配送与优惠 -->
      <div class="mx-4 mt-3 bg-white rounded-2xl overflow-hidden">
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-gray-50">
          <span class="text-sm text-gray-600">配送方式</span>
          <div class="flex items-center text-sm text-gray-800">
            <span>顺丰快递</span>
            <span class="text-gray-400 ml-1">免邮</span>
          </div>
        </div>
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-gray-50">
          <span class="text-sm text-gray-600">优惠券</span>
          <div class="flex items-center text-sm">
            <span class="text-primary">-¥300</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-300 ml-1"></i>
          </div>
        </div>
        <div class="flex items-center justify-between px-4 py-3.5">
          <span class="text-sm text-gray-600">订单备注</span>
          <div class="flex items-center text-sm text-gray-400">
            <span>选填，建议先与卖家沟通</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-300 ml-1"></i>
          </div>
        </div>
      </div>

      <!-- 价格明细 -->
      <div class="mx-4 mt-3 mb-4 bg-white rounded-2xl p-4">
        <div class="space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-sm text-gray-500">商品金额</span>
            <span class="text-sm text-gray-800">¥26,998.00</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-sm text-gray-500">运费</span>
            <span class="text-sm text-green-500">免运费</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-sm text-gray-500">优惠券</span>
            <span class="text-sm text-primary">-¥300.00</span>
          </div>
          <div class="border-t border-gray-100 pt-2.5 flex items-center justify-between">
            <span class="text-sm font-medium text-gray-800">实付金额</span>
            <span class="text-lg font-bold text-primary">¥26,698.00</span>
          </div>
        </div>
      </div>

    </main>

    <!-- 底部提交栏 -->
    <div class="bg-white border-t border-gray-100 safe-area-bottom">
      <div class="flex items-center justify-between px-4 py-3">
        <div>
          <div class="text-sm text-gray-500">合计: <span class="text-primary font-bold text-lg">¥26,698</span></div>
          <div class="text-[10px] text-gray-400">含运费 ¥0.00</div>
        </div>
        <a href="07-order-list.html" class="bg-primary text-white text-sm font-medium px-8 py-2.5 rounded-full block">提交订单</a>
      </div>
      <div class="home-indicator"></div>
    </div>

  </div>

  <script>lucide.createIcons();</script>
</body>
</html>

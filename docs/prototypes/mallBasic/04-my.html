<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>基础商城 - 我的</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#FF6B35', 'primary-light': '#FFF3ED', accent: '#1A1A2E' } } }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .status-bar { height: 44px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">

  <div class="phone-frame bg-gray-50 flex flex-col">

    <div class="status-bar bg-primary">
      <span class="text-white">9:41</span>
      <div class="flex items-center gap-1 text-white">
        <i data-lucide="signal" class="w-4 h-4"></i>
        <i data-lucide="wifi" class="w-4 h-4"></i>
        <i data-lucide="battery-full" class="w-4 h-4"></i>
      </div>
    </div>

    <main class="flex-1 overflow-y-auto hide-scrollbar">

      <!-- 用户信息头部 -->
      <div class="bg-gradient-to-b from-primary to-primary-light px-4 pb-8 pt-4">
        <div class="flex items-center justify-between mb-5">
          <span class="text-white/80 text-sm">我的</span>
          <div class="flex items-center gap-4">
            <i data-lucide="settings" class="w-5 h-5 text-white/80"></i>
            <a href="01-index.html"><i data-lucide="bell" class="w-5 h-5 text-white/80"></i></a>
          </div>
        </div>
        <div class="flex items-center">
          <div class="w-16 h-16 rounded-full bg-white/20 border-2 border-white/50 overflow-hidden flex-shrink-0">
            <img src="https://picsum.photos/128/128?random=99" class="w-full h-full object-cover" alt="">
          </div>
          <div class="ml-4 flex-1">
            <div class="flex items-center gap-2">
              <span class="text-white font-bold text-lg">张三</span>
              <span class="bg-yellow-400 text-yellow-900 text-[10px] font-bold px-2 py-0.5 rounded-full">VIP 3</span>
            </div>
            <span class="text-white/70 text-sm mt-1 block">138****8000</span>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 text-white/50"></i>
        </div>
      </div>

      <!-- 资产卡片 -->
      <div class="mx-4 -mt-4 bg-white rounded-2xl p-4 shadow-sm">
        <div class="grid grid-cols-3 divide-x divide-gray-100">
          <div class="flex flex-col items-center">
            <span class="text-lg font-bold text-gray-800">3</span>
            <span class="text-[11px] text-gray-500 mt-1">优惠券</span>
          </div>
          <div class="flex flex-col items-center">
            <span class="text-lg font-bold text-gray-800">2,580</span>
            <span class="text-[11px] text-gray-500 mt-1">积分</span>
          </div>
          <div class="flex flex-col items-center">
            <span class="text-lg font-bold text-primary">¥128</span>
            <span class="text-[11px] text-gray-500 mt-1">余额</span>
          </div>
        </div>
      </div>

      <!-- 我的订单 -->
      <div class="mx-4 mt-3 bg-white rounded-2xl p-4">
        <a href="07-order-list.html" class="flex items-center justify-between mb-4 block">
          <span class="font-bold text-[15px]">我的订单</span>
          <div class="flex items-center text-gray-400 text-xs">
            <span>全部订单</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </div>
        </a>
        <div class="grid grid-cols-5 gap-1">
          <a href="07-order-list.html" class="flex flex-col items-center gap-1.5">
            <div class="relative">
              <i data-lucide="wallet" class="w-6 h-6 text-gray-600"></i>
              <span class="absolute -top-1.5 -right-2 w-4 h-4 bg-red-500 rounded-full text-white text-[10px] flex items-center justify-center">1</span>
            </div>
            <span class="text-[11px] text-gray-600">待付款</span>
          </a>
          <a href="07-order-list.html" class="flex flex-col items-center gap-1.5">
            <div class="relative">
              <i data-lucide="package" class="w-6 h-6 text-gray-600"></i>
            </div>
            <span class="text-[11px] text-gray-600">待发货</span>
          </a>
          <a href="07-order-list.html" class="flex flex-col items-center gap-1.5">
            <div class="relative">
              <i data-lucide="truck" class="w-6 h-6 text-gray-600"></i>
              <span class="absolute -top-1.5 -right-2 w-4 h-4 bg-red-500 rounded-full text-white text-[10px] flex items-center justify-center">1</span>
            </div>
            <span class="text-[11px] text-gray-600">待收货</span>
          </a>
          <a href="07-order-list.html" class="flex flex-col items-center gap-1.5">
            <i data-lucide="message-square" class="w-6 h-6 text-gray-600"></i>
            <span class="text-[11px] text-gray-600">待评价</span>
          </a>
          <a href="07-order-list.html" class="flex flex-col items-center gap-1.5">
            <i data-lucide="rotate-ccw" class="w-6 h-6 text-gray-600"></i>
            <span class="text-[11px] text-gray-600">售后</span>
          </a>
        </div>
      </div>

      <!-- 我的服务 -->
      <div class="mx-4 mt-3 bg-white rounded-2xl overflow-hidden">
        <div class="px-4 pt-4 pb-2">
          <span class="font-bold text-[15px]">我的服务</span>
        </div>
        <div class="grid grid-cols-4 gap-1 px-2 py-3">
          <div class="flex flex-col items-center gap-1.5 py-2">
            <div class="w-10 h-10 rounded-xl bg-red-50 flex items-center justify-center">
              <i data-lucide="heart" class="w-5 h-5 text-red-500"></i>
            </div>
            <span class="text-[11px] text-gray-600">我的收藏</span>
          </div>
          <div class="flex flex-col items-center gap-1.5 py-2">
            <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center">
              <i data-lucide="clock" class="w-5 h-5 text-blue-500"></i>
            </div>
            <span class="text-[11px] text-gray-600">浏览记录</span>
          </div>
          <div class="flex flex-col items-center gap-1.5 py-2">
            <div class="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center">
              <i data-lucide="map-pin" class="w-5 h-5 text-green-500"></i>
            </div>
            <span class="text-[11px] text-gray-600">收货地址</span>
          </div>
          <div class="flex flex-col items-center gap-1.5 py-2">
            <div class="w-10 h-10 rounded-xl bg-orange-50 flex items-center justify-center">
              <i data-lucide="ticket" class="w-5 h-5 text-orange-500"></i>
            </div>
            <span class="text-[11px] text-gray-600">优惠券</span>
          </div>
        </div>
      </div>

      <!-- 更多功能 -->
      <div class="mx-4 mt-3 mb-4 bg-white rounded-2xl overflow-hidden">
        <a class="flex items-center px-4 py-3.5 border-b border-gray-50 block">
          <i data-lucide="headphones" class="w-5 h-5 text-gray-500 mr-3"></i>
          <span class="text-sm text-gray-700 flex-1">客服中心</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </a>
        <a class="flex items-center px-4 py-3.5 border-b border-gray-50 block">
          <i data-lucide="message-circle" class="w-5 h-5 text-gray-500 mr-3"></i>
          <span class="text-sm text-gray-700 flex-1">意见反馈</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </a>
        <a class="flex items-center px-4 py-3.5 block">
          <i data-lucide="info" class="w-5 h-5 text-gray-500 mr-3"></i>
          <span class="text-sm text-gray-700 flex-1">关于我们</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </a>
      </div>

    </main>

    <!-- 底部 Tab 栏 -->
    <nav class="border-t bg-white safe-area-bottom">
      <div class="flex justify-around py-1.5">
        <a href="01-index.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1">
          <i data-lucide="home" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">首页</span>
        </a>
        <a href="02-category.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1">
          <i data-lucide="grid-2x2" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">分类</span>
        </a>
        <a href="03-cart.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 relative">
          <i data-lucide="shopping-cart" class="w-5 h-5 text-gray-400"></i>
          <span class="absolute -top-0.5 right-3 w-4 h-4 bg-red-500 rounded-full text-white text-[10px] flex items-center justify-center">2</span>
          <span class="text-[10px] text-gray-400">购物车</span>
        </a>
        <a href="04-my.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1">
          <i data-lucide="user" class="w-5 h-5 text-primary"></i>
          <span class="text-[10px] text-primary font-medium">我的</span>
        </a>
      </div>
      <div class="home-indicator"></div>
    </nav>

  </div>

  <script>lucide.createIcons();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>生鲜商城 - 分类</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#22C55E', 'primary-light': '#F0FDF4', accent: '#F97316' } } } }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .status-bar { height: 44px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    a { text-decoration: none; color: inherit; }
    .sidebar-item { padding: 14px 0; text-align: center; font-size: 13px; color: #666; position: relative; transition: all 0.2s; }
    .sidebar-item.active { color: #22C55E; font-weight: 600; background: #fff; }
    .sidebar-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; background: #22C55E; border-radius: 0 2px 2px 0; }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">

  <div class="phone-frame bg-gray-50 flex flex-col">

    <div class="status-bar bg-white">
      <span>9:41</span>
      <div class="flex items-center gap-1">
        <i data-lucide="signal" class="w-4 h-4"></i>
        <i data-lucide="wifi" class="w-4 h-4"></i>
        <i data-lucide="battery-full" class="w-4 h-4"></i>
      </div>
    </div>

    <!-- 搜索栏 -->
    <div class="bg-white px-4 py-2.5 border-b border-gray-100">
      <div class="flex items-center bg-gray-100 rounded-full px-4 py-2">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 mr-2"></i>
        <span class="text-sm text-gray-400">搜索商品</span>
      </div>
    </div>

    <!-- 左右布局 -->
    <div class="flex flex-1 overflow-hidden">
      <!-- 左侧分类 -->
      <div class="w-[88px] bg-gray-100 overflow-y-auto hide-scrollbar flex-shrink-0">
        <div class="sidebar-item active">🥬 蔬菜</div>
        <div class="sidebar-item">🍎 水果</div>
        <div class="sidebar-item">🥩 肉禽</div>
        <div class="sidebar-item">🦐 海鲜</div>
        <div class="sidebar-item">🥚 蛋奶</div>
        <div class="sidebar-item">🍚 粮油</div>
        <div class="sidebar-item">🧊 速食</div>
        <div class="sidebar-item">🍵 饮品</div>
        <div class="sidebar-item">🧴 日用</div>
      </div>

      <!-- 右侧商品 -->
      <div class="flex-1 overflow-y-auto hide-scrollbar bg-white px-3 pt-3">
        <!-- 分类标题 -->
        <div class="text-sm font-bold text-gray-800 mb-3">叶菜类</div>
        <div class="grid grid-cols-3 gap-2 mb-4">
          <div class="flex flex-col items-center">
            <div class="w-[68px] h-[68px] rounded-xl bg-green-50 flex items-center justify-center text-3xl">🥬</div>
            <span class="text-[11px] text-gray-600 mt-1">大白菜</span>
            <span class="text-[10px] text-primary">¥3.5/斤</span>
          </div>
          <div class="flex flex-col items-center">
            <div class="w-[68px] h-[68px] rounded-xl bg-green-50 flex items-center justify-center text-3xl">🥦</div>
            <span class="text-[11px] text-gray-600 mt-1">西蓝花</span>
            <span class="text-[10px] text-primary">¥8.9/份</span>
          </div>
          <div class="flex flex-col items-center">
            <div class="w-[68px] h-[68px] rounded-xl bg-green-50 flex items-center justify-center text-3xl">🥒</div>
            <span class="text-[11px] text-gray-600 mt-1">黄瓜</span>
            <span class="text-[10px] text-primary">¥4.5/斤</span>
          </div>
        </div>

        <div class="text-sm font-bold text-gray-800 mb-3">根茎类</div>
        <div class="grid grid-cols-3 gap-2 mb-4">
          <div class="flex flex-col items-center">
            <div class="w-[68px] h-[68px] rounded-xl bg-orange-50 flex items-center justify-center text-3xl">🥕</div>
            <span class="text-[11px] text-gray-600 mt-1">胡萝卜</span>
            <span class="text-[10px] text-primary">¥2.8/斤</span>
          </div>
          <div class="flex flex-col items-center">
            <div class="w-[68px] h-[68px] rounded-xl bg-yellow-50 flex items-center justify-center text-3xl">🥔</div>
            <span class="text-[11px] text-gray-600 mt-1">土豆</span>
            <span class="text-[10px] text-primary">¥3.2/斤</span>
          </div>
          <div class="flex flex-col items-center">
            <div class="w-[68px] h-[68px] rounded-xl bg-purple-50 flex items-center justify-center text-3xl">🍆</div>
            <span class="text-[11px] text-gray-600 mt-1">茄子</span>
            <span class="text-[10px] text-primary">¥5.0/斤</span>
          </div>
        </div>

        <div class="text-sm font-bold text-gray-800 mb-3">菌菇类</div>
        <div class="grid grid-cols-3 gap-2 mb-4">
          <div class="flex flex-col items-center">
            <div class="w-[68px] h-[68px] rounded-xl bg-amber-50 flex items-center justify-center text-3xl">🍄</div>
            <span class="text-[11px] text-gray-600 mt-1">香菇</span>
            <span class="text-[10px] text-primary">¥9.9/份</span>
          </div>
          <div class="flex flex-col items-center">
            <div class="w-[68px] h-[68px] rounded-xl bg-amber-50 flex items-center justify-center text-3xl">🍄</div>
            <span class="text-[11px] text-gray-600 mt-1">金针菇</span>
            <span class="text-[10px] text-primary">¥4.9/份</span>
          </div>
          <div class="flex flex-col items-center">
            <div class="w-[68px] h-[68px] rounded-xl bg-amber-50 flex items-center justify-center text-3xl">🍄</div>
            <span class="text-[11px] text-gray-600 mt-1">平菇</span>
            <span class="text-[10px] text-primary">¥6.5/份</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部 Tab -->
    <nav class="border-t bg-white safe-area-bottom">
      <div class="flex justify-around py-1.5">
        <a href="01-index.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1">
          <i data-lucide="home" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">首页</span>
        </a>
        <a href="02-category.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1">
          <i data-lucide="grid-2x2" class="w-5 h-5 text-primary"></i>
          <span class="text-[10px] text-primary font-medium">分类</span>
        </a>
        <a href="03-cart.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 relative">
          <i data-lucide="shopping-cart" class="w-5 h-5 text-gray-400"></i>
          <span class="absolute -top-0.5 right-3 w-4 h-4 bg-red-500 rounded-full text-white text-[10px] flex items-center justify-center">5</span>
          <span class="text-[10px] text-gray-400">购物车</span>
        </a>
        <a href="04-my.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1">
          <i data-lucide="user" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">我的</span>
        </a>
      </div>
      <div class="home-indicator"></div>
    </nav>

  </div>

  <script>lucide.createIcons();</script>
</body>
</html>

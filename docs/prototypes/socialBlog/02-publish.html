<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社交博客 - 发布</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .phone-frame { width: 375px; height: 812px; background: #fff; border-radius: 40px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.15); position: relative; display: flex; flex-direction: column; }
    .phone-frame:before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 150px; height: 28px; background: #000; border-radius: 0 0 18px 18px; z-index: 50; }
    .content { flex: 1; overflow-y: auto; }
    .content::-webkit-scrollbar { display: none; }
    .tag-selected { background: #8B5CF6; color: #fff; }
    .tag-normal { background: #f3f4f6; color: #6b7280; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- 状态栏占位 -->
    <div class="h-11 bg-white"></div>

    <!-- 导航栏 -->
    <div class="flex items-center justify-between px-4 py-3 bg-white border-b border-gray-100">
      <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
      <span class="text-base font-semibold text-gray-800">发布文章</span>
      <div class="w-5"></div>
    </div>

    <!-- 内容区 -->
    <div class="content bg-white px-4 pt-4">
      <!-- 标题输入 -->
      <input type="text" placeholder="请输入文章标题" class="w-full text-lg font-bold text-gray-800 placeholder-gray-300 border-none outline-none pb-3 border-b border-gray-100" value="Vue 3 组合式 API 最佳实践" />
      <div class="h-px bg-gray-100 mb-4"></div>

      <!-- 正文编辑 -->
      <textarea rows="8" placeholder="开始写作，分享你的想法..." class="w-full text-sm text-gray-600 placeholder-gray-300 border-none outline-none resize-none leading-6">在 Vue 3 中，组合式 API（Composition API）提供了更灵活的代码组织方式。

与选项式 API 相比，组合式 API 的优势在于：

1. 更好的逻辑复用（通过 composables）
2. 更灵活的代码组织
3. 更好的 TypeScript 支持
4. 更小的生产包体积

下面我们通过实际案例来看看如何在项目中运用这些最佳实践...</textarea>

      <!-- 分隔线 -->
      <div class="h-px bg-gray-100 my-4"></div>

      <!-- 添加图片 -->
      <div class="mb-4">
        <div class="text-sm font-medium text-gray-700 mb-3">添加图片</div>
        <div class="flex gap-3">
          <div class="w-20 h-20 rounded-xl overflow-hidden">
            <img src="https://picsum.photos/200/200?random=10" class="w-full h-full object-cover" alt="" />
          </div>
          <div class="w-20 h-20 rounded-xl overflow-hidden">
            <img src="https://picsum.photos/200/200?random=11" class="w-full h-full object-cover" alt="" />
          </div>
          <div class="w-20 h-20 rounded-xl border-2 border-dashed border-gray-200 flex items-center justify-center bg-gray-50">
            <i data-lucide="plus" class="w-6 h-6 text-gray-300"></i>
          </div>
        </div>
      </div>

      <!-- 分隔线 -->
      <div class="h-px bg-gray-100 my-4"></div>

      <!-- 选择标签 -->
      <div class="mb-4">
        <div class="text-sm font-medium text-gray-700 mb-3">选择标签</div>
        <div class="flex flex-wrap gap-2">
          <span class="tag-selected text-xs px-3 py-1.5 rounded-full font-medium">Vue</span>
          <span class="tag-selected text-xs px-3 py-1.5 rounded-full font-medium">前端</span>
          <span class="tag-normal text-xs px-3 py-1.5 rounded-full">React</span>
          <span class="tag-normal text-xs px-3 py-1.5 rounded-full">TypeScript</span>
          <span class="tag-normal text-xs px-3 py-1.5 rounded-full">后端</span>
          <span class="tag-normal text-xs px-3 py-1.5 rounded-full">设计</span>
          <span class="tag-normal text-xs px-3 py-1.5 rounded-full">AI</span>
          <span class="tag-normal text-xs px-3 py-1.5 rounded-full">运维</span>
          <span class="tag-normal text-xs px-3 py-1.5 rounded-full">产品</span>
        </div>
      </div>

      <!-- 工具栏 -->
      <div class="flex items-center gap-5 py-3 border-t border-gray-100">
        <i data-lucide="image" class="w-5 h-5 text-gray-400"></i>
        <i data-lucide="link" class="w-5 h-5 text-gray-400"></i>
        <i data-lucide="at-sign" class="w-5 h-5 text-gray-400"></i>
        <i data-lucide="hash" class="w-5 h-5 text-gray-400"></i>
        <i data-lucide="smile" class="w-5 h-5 text-gray-400"></i>
      </div>
    </div>

    <!-- 底部发布按钮 -->
    <div class="px-4 py-3 bg-white border-t border-gray-100 pb-8">
      <button class="w-full py-3 rounded-full text-white text-sm font-semibold" style="background: linear-gradient(135deg, #8B5CF6, #a78bfa);">发布文章</button>
    </div>

    <!-- 底部 Tab -->
    <div class="flex items-center justify-around bg-white border-t border-gray-100 py-2 pb-6">
      <a href="01-index.html" class="flex flex-col items-center no-underline">
        <i data-lucide="home" class="w-5 h-5 text-gray-400"></i>
        <span class="text-[10px] text-gray-400 mt-0.5">首页</span>
      </a>
      <a href="02-publish.html" class="flex flex-col items-center no-underline">
        <i data-lucide="plus-circle" class="w-5 h-5 text-violet-500"></i>
        <span class="text-[10px] text-violet-500 mt-0.5 font-medium">发布</span>
      </a>
      <a href="03-follow.html" class="flex flex-col items-center no-underline">
        <i data-lucide="users" class="w-5 h-5 text-gray-400"></i>
        <span class="text-[10px] text-gray-400 mt-0.5">关注</span>
      </a>
      <a href="04-my.html" class="flex flex-col items-center no-underline">
        <i data-lucide="user" class="w-5 h-5 text-gray-400"></i>
        <span class="text-[10px] text-gray-400 mt-0.5">我的</span>
      </a>
    </div>
  </div>

  <script>lucide.createIcons()</script>
</body>
</html>

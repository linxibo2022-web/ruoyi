<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>社交博客 - 我的</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#8B5CF6', 'primary-light': '#F5F3FF' } } }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #e2e8f0; display: flex; justify-content: center; min-height: 100vh; padding: 20px 0; }
    .phone-frame { width: 375px; height: 812px; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: flex; flex-direction: column; background: #f8fafc; }
    .status-bar { height: 44px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar" style="background: #8B5CF6;">
      <span class="text-white">9:41</span>
      <div class="flex items-center gap-1 text-white">
        <i data-lucide="signal" class="w-4 h-4"></i>
        <i data-lucide="wifi" class="w-4 h-4"></i>
        <i data-lucide="battery-full" class="w-4 h-4"></i>
      </div>
    </div>

    <main class="flex-1 overflow-y-auto hide-scrollbar">
      <!-- 紫色渐变头部 -->
      <div class="px-5 pt-4 pb-16" style="background: linear-gradient(135deg, #8B5CF6, #a78bfa, #c4b5fd);">
        <div class="flex items-center justify-between mb-5">
          <span class="text-white/80 text-sm">我的</span>
          <i data-lucide="settings" class="w-5 h-5 text-white/80"></i>
        </div>
        <div class="flex items-center">
          <div class="w-14 h-14 rounded-full bg-white/20 border-2 border-white/50 flex items-center justify-center text-2xl">👨‍💻</div>
          <div class="ml-3 flex-1">
            <span class="text-white font-bold text-lg block">张三丰</span>
            <span class="text-white/70 text-xs block mt-0.5">全栈开发者 | 技术博主</span>
          </div>
          <span class="text-xs bg-amber-400 text-amber-900 px-2.5 py-1 rounded-full font-medium">✍️ 创作者</span>
        </div>
      </div>

      <!-- 数据卡片 -->
      <div class="mx-4 -mt-8 bg-white rounded-2xl p-5 shadow-sm">
        <div class="grid grid-cols-3 divide-x divide-gray-100">
          <div class="text-center">
            <div class="text-xl font-bold text-gray-800">1,286</div>
            <div class="text-xs text-gray-500 mt-1">粉丝</div>
          </div>
          <div class="text-center">
            <div class="text-xl font-bold text-gray-800">328</div>
            <div class="text-xs text-gray-500 mt-1">关注</div>
          </div>
          <div class="text-center">
            <div class="text-xl font-bold text-primary">5,692</div>
            <div class="text-xs text-gray-500 mt-1">获赞</div>
          </div>
        </div>
      </div>

      <!-- 我的文章 -->
      <div class="mx-4 mt-4 bg-white rounded-2xl p-4">
        <div class="flex items-center justify-between mb-3">
          <span class="font-bold text-sm text-gray-800">我的文章</span>
          <span class="text-xs text-primary">查看全部 →</span>
        </div>
        <div class="space-y-3">
          <div class="border-b border-gray-50 pb-3">
            <div class="text-[13px] font-medium text-gray-800">Vue 3 组合式 API 最佳实践总结</div>
            <div class="flex items-center gap-3 mt-1.5 text-[11px] text-gray-400">
              <span class="flex items-center gap-0.5"><i data-lucide="eye" class="w-3 h-3"></i> 2,350</span>
              <span class="flex items-center gap-0.5"><i data-lucide="heart" class="w-3 h-3"></i> 186</span>
              <span>3天前</span>
            </div>
          </div>
          <div class="border-b border-gray-50 pb-3">
            <div class="text-[13px] font-medium text-gray-800">TypeScript 高级类型体操指南</div>
            <div class="flex items-center gap-3 mt-1.5 text-[11px] text-gray-400">
              <span class="flex items-center gap-0.5"><i data-lucide="eye" class="w-3 h-3"></i> 1,890</span>
              <span class="flex items-center gap-0.5"><i data-lucide="heart" class="w-3 h-3"></i> 142</span>
              <span>1周前</span>
            </div>
          </div>
          <div>
            <div class="text-[13px] font-medium text-gray-800">从零搭建微前端架构实战经验</div>
            <div class="flex items-center gap-3 mt-1.5 text-[11px] text-gray-400">
              <span class="flex items-center gap-0.5"><i data-lucide="eye" class="w-3 h-3"></i> 3,120</span>
              <span class="flex items-center gap-0.5"><i data-lucide="heart" class="w-3 h-3"></i> 258</span>
              <span>2周前</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 更多功能 -->
      <div class="mx-4 mt-4 mb-4 bg-white rounded-2xl overflow-hidden">
        <div class="px-4 pt-4 pb-2">
          <span class="font-bold text-sm text-gray-800">更多功能</span>
        </div>
        <div class="px-4 py-3 flex items-center justify-between border-b border-gray-50">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-violet-50 rounded-lg flex items-center justify-center"><i data-lucide="bookmark" class="w-4 h-4 text-violet-500"></i></div>
            <span class="text-sm text-gray-700">我的收藏</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="px-4 py-3 flex items-center justify-between border-b border-gray-50">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-orange-50 rounded-lg flex items-center justify-center"><i data-lucide="clock" class="w-4 h-4 text-orange-500"></i></div>
            <span class="text-sm text-gray-700">浏览历史</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="px-4 py-3 flex items-center justify-between border-b border-gray-50">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-50 rounded-lg flex items-center justify-center"><i data-lucide="bar-chart-3" class="w-4 h-4 text-blue-500"></i></div>
            <span class="text-sm text-gray-700">数据中心</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="px-4 py-3 flex items-center justify-between border-b border-gray-50">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-amber-50 rounded-lg flex items-center justify-center"><i data-lucide="message-square" class="w-4 h-4 text-amber-500"></i></div>
            <span class="text-sm text-gray-700">意见反馈</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-cyan-50 rounded-lg flex items-center justify-center"><i data-lucide="info" class="w-4 h-4 text-cyan-500"></i></div>
            <span class="text-sm text-gray-700">关于我们</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
      </div>
    </main>

    <!-- 底部 Tab -->
    <nav class="border-t bg-white safe-area-bottom">
      <div class="flex justify-around py-1.5">
        <a href="01-index.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1">
          <i data-lucide="home" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">首页</span>
        </a>
        <a href="02-publish.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1">
          <i data-lucide="plus-circle" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">发布</span>
        </a>
        <a href="03-follow.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1">
          <i data-lucide="users" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">关注</span>
        </a>
        <a href="04-my.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1">
          <i data-lucide="user" class="w-5 h-5 text-primary"></i>
          <span class="text-[10px] text-primary font-medium">我的</span>
        </a>
      </div>
      <div class="home-indicator"></div>
    </nav>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>企业官网 - 联系我们</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#1E40AF' } } } }</script>
  <style>
    .phone-frame { width: 375px; height: 812px; margin: 20px auto; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .status-bar { height: 44px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">
  <div class="phone-frame bg-gray-50 flex flex-col">
    <div class="status-bar bg-white"><span>9:41</span><div class="flex items-center gap-1"><i data-lucide="signal" class="w-4 h-4"></i><i data-lucide="wifi" class="w-4 h-4"></i><i data-lucide="battery-full" class="w-4 h-4"></i></div></div>

    <main class="flex-1 overflow-y-auto">
      <div class="bg-white px-5 pt-3 pb-4">
        <p class="text-2xl font-bold text-gray-800">联系我们</p>
      </div>

      <!-- 联系方式 -->
      <div class="mx-5 mt-4 bg-white rounded-2xl overflow-hidden shadow-sm">
        <div class="flex items-center px-5 py-4 border-b border-gray-50">
          <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center mr-3"><span class="text-lg">📞</span></div>
          <div class="flex-1">
            <p class="text-sm font-semibold text-gray-800">客服热线</p>
            <p class="text-xs text-primary mt-0.5">400-888-9999</p>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="flex items-center px-5 py-4 border-b border-gray-50">
          <div class="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center mr-3"><span class="text-lg">📧</span></div>
          <div class="flex-1">
            <p class="text-sm font-semibold text-gray-800">商务邮箱</p>
            <p class="text-xs text-gray-400 mt-0.5">business@techcorp.com</p>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="flex items-center px-5 py-4 border-b border-gray-50">
          <div class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center mr-3"><span class="text-lg">🏢</span></div>
          <div class="flex-1">
            <p class="text-sm font-semibold text-gray-800">公司地址</p>
            <p class="text-xs text-gray-400 mt-0.5">上海市浦东新区张江高科技园区</p>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="flex items-center px-5 py-4">
          <div class="w-10 h-10 rounded-xl bg-purple-50 flex items-center justify-center mr-3"><span class="text-lg">🕐</span></div>
          <div class="flex-1">
            <p class="text-sm font-semibold text-gray-800">工作时间</p>
            <p class="text-xs text-gray-400 mt-0.5">周一至周五 9:00 - 18:00</p>
          </div>
        </div>
      </div>

      <!-- 在线咨询表单 -->
      <div class="mx-5 mt-5 bg-white rounded-2xl p-5 shadow-sm">
        <p class="text-base font-bold text-gray-800 mb-4">在线留言</p>
        <div class="space-y-3">
          <div>
            <p class="text-xs text-gray-500 mb-1.5">您的姓名</p>
            <div class="bg-gray-50 rounded-xl px-4 py-2.5"><span class="text-xs text-gray-400">请输入姓名</span></div>
          </div>
          <div>
            <p class="text-xs text-gray-500 mb-1.5">联系电话</p>
            <div class="bg-gray-50 rounded-xl px-4 py-2.5"><span class="text-xs text-gray-400">请输入手机号</span></div>
          </div>
          <div>
            <p class="text-xs text-gray-500 mb-1.5">公司名称</p>
            <div class="bg-gray-50 rounded-xl px-4 py-2.5"><span class="text-xs text-gray-400">请输入公司名称</span></div>
          </div>
          <div>
            <p class="text-xs text-gray-500 mb-1.5">咨询内容</p>
            <div class="bg-gray-50 rounded-xl px-4 py-3 h-24"><span class="text-xs text-gray-400">请描述您的需求...</span></div>
          </div>
          <button class="w-full py-2.5 rounded-xl text-white text-sm font-medium" style="background: linear-gradient(135deg, #1E40AF, #3B82F6);">提交留言</button>
        </div>
      </div>

      <!-- 地图占位 -->
      <div class="mx-5 mt-5 mb-4 bg-white rounded-2xl overflow-hidden shadow-sm">
        <div class="h-40 bg-blue-50 flex items-center justify-center">
          <div class="text-center">
            <span class="text-3xl block mb-1">📍</span>
            <p class="text-xs text-gray-400">地图 · 张江高科技园区</p>
          </div>
        </div>
        <div class="px-4 py-3 flex items-center justify-between">
          <p class="text-xs text-gray-600">上海市浦东新区张江路 1688 号</p>
          <span class="text-primary text-xs font-medium">导航 ›</span>
        </div>
      </div>
      <div class="h-4"></div>
    </main>

    <nav class="border-t bg-white safe-area-bottom">
      <div class="flex justify-around py-1.5">
        <a href="01-index.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="home" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">首页</span></a>
        <a href="02-about.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="info" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">关于</span></a>
        <a href="03-product.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="box" class="w-5 h-5 text-gray-400"></i><span class="text-[10px] text-gray-400">产品</span></a>
        <a href="04-contact.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline"><i data-lucide="phone" class="w-5 h-5 text-primary"></i><span class="text-[10px] text-primary font-medium">联系</span></a>
      </div>
      <div class="home-indicator"></div>
    </nav>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, user-scalable=no">
<title>在线考试 - 题库</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 375px; height: 812px; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; background: #f5f7fa; display: flex; flex-direction: column; position: relative; }
  .status-bar { height: 44px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
  .status-bar span { color: #1a1a1a; font-size: 12px; font-weight: 600; }
  .page-content { flex: 1; overflow-y: auto; }
  .page-content::-webkit-scrollbar { display: none; }
  .tab-bar { display: flex; background: white; border-top: 1px solid #e5e7eb; padding: 6px 0; flex-shrink: 0; }
  .tab-bar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #9ca3af; font-size: 10px; padding: 4px 0; }
  .tab-bar a.active { color: #3B82F6; }
  .tab-bar a i { width: 22px; height: 22px; }
  .safe-area-bottom { height: 20px; background: white; flex-shrink: 0; }
  .home-indicator { width: 134px; height: 5px; background: #1a1a1a; border-radius: 3px; margin: 0 auto 8px; }
</style>
</head>
<body>
<div class="phone-frame">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>9:41</span>
    <span>●●●●● ⚡ 100%</span>
  </div>

  <!-- Page Content -->
  <div class="page-content">
    <!-- Header -->
    <div class="bg-white px-4 pb-4">
      <h1 class="text-lg font-bold text-gray-800 mb-3">题库</h1>
      <!-- Search -->
      <div class="bg-gray-100 rounded-xl px-3 py-2.5 flex items-center gap-2">
        <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
        <span class="text-gray-400 text-xs">搜索题目、知识点...</span>
      </div>
    </div>

    <!-- Subject Grid -->
    <div class="px-4 mt-4">
      <h2 class="text-sm font-bold text-gray-800 mb-3">科目分类</h2>
      <div class="grid grid-cols-4 gap-3">
        <!-- Subject 1 -->
        <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
          <div class="text-2xl mb-1">📖</div>
          <div class="text-xs font-medium text-gray-700">语文</div>
          <div class="text-[10px] text-gray-400 mt-0.5">520题</div>
        </div>
        <!-- Subject 2 -->
        <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
          <div class="text-2xl mb-1">🔢</div>
          <div class="text-xs font-medium text-gray-700">数学</div>
          <div class="text-[10px] text-gray-400 mt-0.5">680题</div>
        </div>
        <!-- Subject 3 -->
        <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
          <div class="text-2xl mb-1">🔤</div>
          <div class="text-xs font-medium text-gray-700">英语</div>
          <div class="text-[10px] text-gray-400 mt-0.5">890题</div>
        </div>
        <!-- Subject 4 -->
        <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
          <div class="text-2xl mb-1">⚛️</div>
          <div class="text-xs font-medium text-gray-700">物理</div>
          <div class="text-[10px] text-gray-400 mt-0.5">430题</div>
        </div>
        <!-- Subject 5 -->
        <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
          <div class="text-2xl mb-1">🧪</div>
          <div class="text-xs font-medium text-gray-700">化学</div>
          <div class="text-[10px] text-gray-400 mt-0.5">350题</div>
        </div>
        <!-- Subject 6 -->
        <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
          <div class="text-2xl mb-1">🧬</div>
          <div class="text-xs font-medium text-gray-700">生物</div>
          <div class="text-[10px] text-gray-400 mt-0.5">280题</div>
        </div>
        <!-- Subject 7 -->
        <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
          <div class="text-2xl mb-1">📜</div>
          <div class="text-xs font-medium text-gray-700">历史</div>
          <div class="text-[10px] text-gray-400 mt-0.5">410题</div>
        </div>
        <!-- Subject 8 -->
        <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
          <div class="text-2xl mb-1">🌍</div>
          <div class="text-xs font-medium text-gray-700">地理</div>
          <div class="text-[10px] text-gray-400 mt-0.5">320题</div>
        </div>
      </div>
    </div>

    <!-- Recent Updated -->
    <div class="px-4 mt-5 mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-gray-800">最近更新</h2>
        <span class="text-xs text-blue-500">查看全部</span>
      </div>

      <!-- Bank Item 1 -->
      <div class="bg-white rounded-2xl p-3.5 shadow-sm mb-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-lg">🔢</div>
          <div class="flex-1">
            <h3 class="text-sm font-bold text-gray-800">高等数学·微积分</h3>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[10px] text-gray-400">120题</span>
              <span class="text-[10px] text-gray-300">|</span>
              <span class="text-[10px] text-gray-400">更新于今天</span>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
      </div>

      <!-- Bank Item 2 -->
      <div class="bg-white rounded-2xl p-3.5 shadow-sm mb-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-green-50 rounded-xl flex items-center justify-center text-lg">🔤</div>
          <div class="flex-1">
            <h3 class="text-sm font-bold text-gray-800">英语四级·听力真题</h3>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[10px] text-gray-400">200题</span>
              <span class="text-[10px] text-gray-300">|</span>
              <span class="text-[10px] text-gray-400">更新于昨天</span>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
      </div>

      <!-- Bank Item 3 -->
      <div class="bg-white rounded-2xl p-3.5 shadow-sm mb-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-purple-50 rounded-xl flex items-center justify-center text-lg">⚛️</div>
          <div class="flex-1">
            <h3 class="text-sm font-bold text-gray-800">大学物理·电磁学</h3>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[10px] text-gray-400">85题</span>
              <span class="text-[10px] text-gray-300">|</span>
              <span class="text-[10px] text-gray-400">更新于3天前</span>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
      </div>

      <!-- Bank Item 4 -->
      <div class="bg-white rounded-2xl p-3.5 shadow-sm mb-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-orange-50 rounded-xl flex items-center justify-center text-lg">🧪</div>
          <div class="flex-1">
            <h3 class="text-sm font-bold text-gray-800">有机化学·基础篇</h3>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[10px] text-gray-400">95题</span>
              <span class="text-[10px] text-gray-300">|</span>
              <span class="text-[10px] text-gray-400">更新于5天前</span>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
      </div>

      <!-- Bank Item 5 -->
      <div class="bg-white rounded-2xl p-3.5 shadow-sm">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-red-50 rounded-xl flex items-center justify-center text-lg">📖</div>
          <div class="flex-1">
            <h3 class="text-sm font-bold text-gray-800">古代文学·诗词鉴赏</h3>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[10px] text-gray-400">150题</span>
              <span class="text-[10px] text-gray-300">|</span>
              <span class="text-[10px] text-gray-400">更新于1周前</span>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <a href="01-index.html">
      <i data-lucide="home"></i>
      <span>首页</span>
    </a>
    <a href="02-bank.html" class="active">
      <i data-lucide="database"></i>
      <span>题库</span>
    </a>
    <a href="03-practice.html">
      <i data-lucide="pen-tool"></i>
      <span>练习</span>
    </a>
    <a href="04-my.html">
      <i data-lucide="user"></i>
      <span>我的</span>
    </a>
  </div>

  <!-- Safe Area -->
  <div class="safe-area-bottom">
    <div class="home-indicator"></div>
  </div>
</div>

<script>
  lucide.createIcons();
</script>
</body>
</html>

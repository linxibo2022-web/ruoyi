<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, user-scalable=no">
<title>在线考试 - 首页</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 375px; height: 812px; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; background: #f5f7fa; display: flex; flex-direction: column; position: relative; }
  .status-bar { height: 44px; background: #3B82F6; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
  .status-bar span { color: white; font-size: 12px; font-weight: 600; }
  .page-content { flex: 1; overflow-y: auto; }
  .page-content::-webkit-scrollbar { display: none; }
  .tab-bar { display: flex; background: white; border-top: 1px solid #e5e7eb; padding: 6px 0; flex-shrink: 0; }
  .tab-bar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #9ca3af; font-size: 10px; padding: 4px 0; }
  .tab-bar a.active { color: #3B82F6; }
  .tab-bar a i { width: 22px; height: 22px; }
  .safe-area-bottom { height: 20px; background: white; flex-shrink: 0; }
  .home-indicator { width: 134px; height: 5px; background: #1a1a1a; border-radius: 3px; margin: 0 auto 8px; }
</style>
</head>
<body>
<div class="phone-frame">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>9:41</span>
    <span>●●●●● ⚡ 100%</span>
  </div>

  <!-- Page Content -->
  <div class="page-content">
    <!-- Header -->
    <div style="background: linear-gradient(135deg, #3B82F6, #1D4ED8); padding: 16px 16px 28px;">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h1 class="text-white text-lg font-bold">在线考试</h1>
          <p class="text-blue-200 text-xs mt-0.5">学无止境，考以致知</p>
        </div>
        <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center">
          <i data-lucide="bell" class="w-4 h-4 text-white"></i>
        </div>
      </div>
      <!-- Search -->
      <div class="bg-white/20 rounded-xl px-3 py-2.5 flex items-center gap-2">
        <i data-lucide="search" class="w-4 h-4 text-white/70"></i>
        <span class="text-white/60 text-xs">搜索考试、题目...</span>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="px-4 -mt-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm grid grid-cols-4 gap-2">
        <div class="text-center">
          <div class="text-xl font-bold text-blue-600">3</div>
          <div class="text-[10px] text-gray-400 mt-0.5">今日完成</div>
        </div>
        <div class="text-center">
          <div class="text-xl font-bold text-green-500">86%</div>
          <div class="text-[10px] text-gray-400 mt-0.5">正确率</div>
        </div>
        <div class="text-center">
          <div class="text-xl font-bold text-orange-500">128</div>
          <div class="text-[10px] text-gray-400 mt-0.5">累计题目</div>
        </div>
        <div class="text-center">
          <div class="text-xl font-bold text-purple-500">4.5h</div>
          <div class="text-[10px] text-gray-400 mt-0.5">学习时长</div>
        </div>
      </div>
    </div>

    <!-- Hot Banner -->
    <div class="px-4 mt-4">
      <div class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-white font-bold text-sm">期中模拟大考</div>
          <div class="text-blue-100 text-xs mt-1">全科综合 · 限时优惠</div>
          <div class="bg-white/20 rounded-full px-3 py-1 text-white text-xs mt-2 inline-block">立即参加</div>
        </div>
        <div class="text-4xl">🏆</div>
      </div>
    </div>

    <!-- Exam List -->
    <div class="px-4 mt-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-gray-800">推荐考试</h2>
        <span class="text-xs text-blue-500">查看更多</span>
      </div>

      <!-- Exam Item 1 -->
      <div class="bg-white rounded-2xl p-3.5 shadow-sm mb-3">
        <div class="flex items-start justify-between">
          <div class="flex-1">
            <h3 class="text-sm font-bold text-gray-800">高等数学期末模拟</h3>
            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="bg-blue-50 text-blue-600 text-[10px] px-2 py-0.5 rounded-full">数学</span>
              <span class="bg-orange-50 text-orange-500 text-[10px] px-2 py-0.5 rounded-full">中等</span>
            </div>
            <div class="flex items-center gap-3 mt-2 text-[10px] text-gray-400">
              <span class="flex items-center gap-0.5"><i data-lucide="file-text" class="w-3 h-3"></i> 50题</span>
              <span class="flex items-center gap-0.5"><i data-lucide="clock" class="w-3 h-3"></i> 90分钟</span>
              <span class="flex items-center gap-0.5"><i data-lucide="users" class="w-3 h-3"></i> 1.2k人</span>
            </div>
          </div>
          <div class="bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium">参加</div>
        </div>
      </div>

      <!-- Exam Item 2 -->
      <div class="bg-white rounded-2xl p-3.5 shadow-sm mb-3">
        <div class="flex items-start justify-between">
          <div class="flex-1">
            <h3 class="text-sm font-bold text-gray-800">大学英语四级真题</h3>
            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="bg-green-50 text-green-600 text-[10px] px-2 py-0.5 rounded-full">英语</span>
              <span class="bg-red-50 text-red-500 text-[10px] px-2 py-0.5 rounded-full">困难</span>
            </div>
            <div class="flex items-center gap-3 mt-2 text-[10px] text-gray-400">
              <span class="flex items-center gap-0.5"><i data-lucide="file-text" class="w-3 h-3"></i> 80题</span>
              <span class="flex items-center gap-0.5"><i data-lucide="clock" class="w-3 h-3"></i> 120分钟</span>
              <span class="flex items-center gap-0.5"><i data-lucide="users" class="w-3 h-3"></i> 3.5k人</span>
            </div>
          </div>
          <div class="bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium">参加</div>
        </div>
      </div>

      <!-- Exam Item 3 -->
      <div class="bg-white rounded-2xl p-3.5 shadow-sm mb-3">
        <div class="flex items-start justify-between">
          <div class="flex-1">
            <h3 class="text-sm font-bold text-gray-800">物理力学专项测试</h3>
            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="bg-purple-50 text-purple-600 text-[10px] px-2 py-0.5 rounded-full">物理</span>
              <span class="bg-yellow-50 text-yellow-600 text-[10px] px-2 py-0.5 rounded-full">简单</span>
            </div>
            <div class="flex items-center gap-3 mt-2 text-[10px] text-gray-400">
              <span class="flex items-center gap-0.5"><i data-lucide="file-text" class="w-3 h-3"></i> 30题</span>
              <span class="flex items-center gap-0.5"><i data-lucide="clock" class="w-3 h-3"></i> 45分钟</span>
              <span class="flex items-center gap-0.5"><i data-lucide="users" class="w-3 h-3"></i> 856人</span>
            </div>
          </div>
          <div class="bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium">参加</div>
        </div>
      </div>

      <!-- Exam Item 4 -->
      <div class="bg-white rounded-2xl p-3.5 shadow-sm">
        <div class="flex items-start justify-between">
          <div class="flex-1">
            <h3 class="text-sm font-bold text-gray-800">计算机二级模拟</h3>
            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="bg-cyan-50 text-cyan-600 text-[10px] px-2 py-0.5 rounded-full">计算机</span>
              <span class="bg-orange-50 text-orange-500 text-[10px] px-2 py-0.5 rounded-full">中等</span>
            </div>
            <div class="flex items-center gap-3 mt-2 text-[10px] text-gray-400">
              <span class="flex items-center gap-0.5"><i data-lucide="file-text" class="w-3 h-3"></i> 40题</span>
              <span class="flex items-center gap-0.5"><i data-lucide="clock" class="w-3 h-3"></i> 60分钟</span>
              <span class="flex items-center gap-0.5"><i data-lucide="users" class="w-3 h-3"></i> 2.1k人</span>
            </div>
          </div>
          <div class="bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium">参加</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <a href="01-index.html" class="active">
      <i data-lucide="home"></i>
      <span>首页</span>
    </a>
    <a href="02-bank.html">
      <i data-lucide="database"></i>
      <span>题库</span>
    </a>
    <a href="03-practice.html">
      <i data-lucide="pen-tool"></i>
      <span>练习</span>
    </a>
    <a href="04-my.html">
      <i data-lucide="user"></i>
      <span>我的</span>
    </a>
  </div>

  <!-- Safe Area -->
  <div class="safe-area-bottom">
    <div class="home-indicator"></div>
  </div>
</div>

<script>
  lucide.createIcons();
</script>
</body>
</html>

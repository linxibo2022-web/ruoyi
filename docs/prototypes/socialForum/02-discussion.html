<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, user-scalable=no">
<title>社区论坛 - 讨论</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#0891B2',
        'primary-light': '#E0F7FA',
        'primary-dark': '#0E7490',
      }
    }
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 375px; height: 812px; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; background: #f5f5f5; position: relative; display: flex; flex-direction: column; }
  .status-bar { height: 44px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }
  .screen-content { flex: 1; overflow-y: auto; background: #f5f5f5; }
  .screen-content::-webkit-scrollbar { display: none; }
  .tab-bar { height: 83px; background: #fff; border-top: 1px solid #e5e5e5; display: flex; padding-bottom: 34px; flex-shrink: 0; }
  .tab-bar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #999; font-size: 10px; gap: 2px; }
  .tab-bar a.active { color: #0891B2; }
  .tab-bar a i { width: 24px; height: 24px; }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: #1a1a1a; border-radius: 3px; }
  textarea { resize: none; }
  textarea:focus, input:focus { outline: none; }
</style>
</head>
<body>
<div class="phone-frame">
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <i data-lucide="signal" style="width:16px;height:16px;"></i>
      <i data-lucide="wifi" style="width:16px;height:16px;"></i>
      <i data-lucide="battery-full" style="width:16px;height:16px;"></i>
    </div>
  </div>

  <!-- Screen Content -->
  <div class="screen-content">
    <!-- Header -->
    <div class="bg-white px-4 pb-3 flex items-center justify-between">
      <h1 class="text-lg font-bold text-gray-900">发布讨论</h1>
      <i data-lucide="x" class="w-5 h-5 text-gray-400"></i>
    </div>

    <!-- Form -->
    <div class="bg-white mt-2 px-4 py-4">
      <!-- Section Selector -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-2">选择板块</label>
        <div class="flex items-center justify-between border border-gray-200 rounded-xl px-4 py-3 bg-gray-50">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">
              <i data-lucide="code-2" class="w-4 h-4 text-blue-500"></i>
            </div>
            <span class="text-sm text-gray-700">技术</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
        </div>
        <!-- Section Options (collapsed style) -->
        <div class="flex flex-wrap gap-2 mt-3">
          <span class="px-3 py-1.5 rounded-full bg-primary text-white text-xs font-medium">技术</span>
          <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 text-xs">生活</span>
          <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 text-xs">影视</span>
          <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 text-xs">游戏</span>
          <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 text-xs">读书</span>
          <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 text-xs">旅行</span>
        </div>
      </div>

      <!-- Title Input -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-2">帖子标题</label>
        <input type="text" placeholder="请输入帖子标题（5-50字）" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm bg-gray-50 placeholder-gray-400">
        <div class="flex justify-end mt-1">
          <span class="text-xs text-gray-400">0 / 50</span>
        </div>
      </div>

      <!-- Content Input -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-2">帖子内容</label>
        <textarea rows="8" placeholder="分享你的想法、经验或问题..." class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm bg-gray-50 placeholder-gray-400 leading-relaxed"></textarea>
        <div class="flex justify-end mt-1">
          <span class="text-xs text-gray-400">0 / 10000</span>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="flex items-center gap-4 mb-5 pb-4 border-b border-gray-100">
        <button class="flex items-center gap-1 text-gray-500">
          <i data-lucide="bold" class="w-4 h-4"></i>
        </button>
        <button class="flex items-center gap-1 text-gray-500">
          <i data-lucide="italic" class="w-4 h-4"></i>
        </button>
        <button class="flex items-center gap-1 text-gray-500">
          <i data-lucide="list" class="w-4 h-4"></i>
        </button>
        <button class="flex items-center gap-1 text-gray-500">
          <i data-lucide="link" class="w-4 h-4"></i>
        </button>
        <button class="flex items-center gap-1 text-gray-500">
          <i data-lucide="at-sign" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Add Images -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-2">添加图片</label>
        <div class="flex gap-3">
          <div class="w-20 h-20 rounded-xl bg-gray-100 border-2 border-dashed border-gray-300 flex flex-col items-center justify-center cursor-pointer">
            <i data-lucide="plus" class="w-6 h-6 text-gray-400"></i>
            <span class="text-[10px] text-gray-400 mt-1">添加图片</span>
          </div>
          <!-- Uploaded image placeholder -->
          <div class="w-20 h-20 rounded-xl bg-gradient-to-br from-cyan-100 to-blue-100 relative overflow-hidden">
            <div class="absolute inset-0 flex items-center justify-center">
              <i data-lucide="image" class="w-8 h-8 text-cyan-300"></i>
            </div>
            <button class="absolute top-1 right-1 w-4 h-4 bg-black/50 rounded-full flex items-center justify-center">
              <i data-lucide="x" class="w-3 h-3 text-white"></i>
            </button>
          </div>
        </div>
        <p class="text-xs text-gray-400 mt-2">最多上传9张图片，单张不超过10MB</p>
      </div>

      <!-- Settings -->
      <div class="space-y-3 mb-6">
        <div class="flex items-center justify-between py-2">
          <div class="flex items-center gap-2">
            <i data-lucide="hash" class="w-4 h-4 text-gray-400"></i>
            <span class="text-sm text-gray-700">添加话题标签</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
        </div>
        <div class="flex items-center justify-between py-2">
          <div class="flex items-center gap-2">
            <i data-lucide="map-pin" class="w-4 h-4 text-gray-400"></i>
            <span class="text-sm text-gray-700">添加位置</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
        </div>
      </div>

      <!-- Submit Button -->
      <button class="w-full py-3.5 bg-primary text-white rounded-xl font-medium text-sm active:bg-primary-dark transition-colors">
        发布帖子
      </button>
      <p class="text-center text-xs text-gray-400 mt-3">发布即表示同意 <span class="text-primary">社区规范</span></p>
    </div>

    <div class="h-4"></div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <a href="01-index.html">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span>首页</span>
    </a>
    <a href="02-discussion.html" class="active">
      <i data-lucide="pen-square" class="w-5 h-5"></i>
      <span>讨论</span>
    </a>
    <a href="03-message.html">
      <i data-lucide="message-circle" class="w-5 h-5"></i>
      <span>消息</span>
    </a>
    <a href="04-my.html">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span>我的</span>
    </a>
  </div>
  <div class="home-indicator"></div>
</div>

<script>
  lucide.createIcons();
</script>
</body>
</html>

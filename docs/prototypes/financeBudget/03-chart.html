<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>预算管理 - 统计</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#F59E0B',
            'primary-dark': '#D97706',
            'primary-light': '#FEF3C7',
          }
        }
      }
    }
  </script>
  <style>
    .phone-frame {
      width: 375px;
      height: 812px;
      margin: 20px auto;
      border: 8px solid #1a1a1a;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .status-bar {
      height: 44px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator {
      width: 134px;
      height: 5px;
      background: #000;
      border-radius: 3px;
      margin: 8px auto;
    }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">
  <div class="phone-frame bg-gray-50 flex flex-col">

    <!-- 状态栏 -->
    <div class="status-bar bg-white">
      <span>9:41</span>
      <div class="flex items-center gap-1">
        <i data-lucide="signal" class="w-4 h-4"></i>
        <i data-lucide="wifi" class="w-4 h-4"></i>
        <i data-lucide="battery-full" class="w-4 h-4"></i>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="flex-1 overflow-y-auto">

      <!-- 顶部 -->
      <div class="bg-white px-5 pt-3 pb-4">
        <p class="text-2xl font-bold text-gray-800 mb-4">统计</p>

        <!-- 周/月/年 Tab -->
        <div class="flex bg-gray-100 rounded-xl p-1">
          <button class="flex-1 py-2 rounded-lg text-sm font-medium text-gray-400">周</button>
          <button class="flex-1 py-2 rounded-lg text-sm font-semibold bg-white text-gray-800 shadow-sm">月</button>
          <button class="flex-1 py-2 rounded-lg text-sm font-medium text-gray-400">年</button>
        </div>
      </div>

      <!-- 月度总览 -->
      <div class="mx-5 mt-4 bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <div class="flex items-center gap-2">
            <i data-lucide="chevron-left" class="w-4 h-4 text-gray-400"></i>
            <span class="text-sm font-semibold text-gray-800">2026年4月</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-4 text-center">
          <div>
            <p class="text-xl font-bold text-red-500">¥3,260</p>
            <p class="text-[11px] text-gray-400 mt-1">支出</p>
          </div>
          <div>
            <p class="text-xl font-bold text-green-500">¥12,000</p>
            <p class="text-[11px] text-gray-400 mt-1">收入</p>
          </div>
          <div>
            <p class="text-xl font-bold text-primary">¥8,740</p>
            <p class="text-[11px] text-gray-400 mt-1">结余</p>
          </div>
        </div>
      </div>

      <!-- 支出趋势（模拟柱状图） -->
      <div class="mx-5 mt-5 bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-semibold text-gray-800">支出趋势</span>
          <span class="text-xs text-gray-400">近7天</span>
        </div>

        <!-- 模拟柱状图 -->
        <div class="flex items-end justify-between gap-2 h-32 mb-2">
          <div class="flex-1 flex flex-col items-center gap-1">
            <span class="text-[9px] text-gray-400">¥86</span>
            <div class="w-full rounded-t-lg" style="height: 43%; background: linear-gradient(180deg, #FBBF24, #F59E0B);"></div>
          </div>
          <div class="flex-1 flex flex-col items-center gap-1">
            <span class="text-[9px] text-gray-400">¥120</span>
            <div class="w-full rounded-t-lg" style="height: 60%; background: linear-gradient(180deg, #FBBF24, #F59E0B);"></div>
          </div>
          <div class="flex-1 flex flex-col items-center gap-1">
            <span class="text-[9px] text-gray-400">¥45</span>
            <div class="w-full rounded-t-lg" style="height: 22%; background: linear-gradient(180deg, #FBBF24, #F59E0B);"></div>
          </div>
          <div class="flex-1 flex flex-col items-center gap-1">
            <span class="text-[9px] text-gray-400">¥200</span>
            <div class="w-full rounded-t-lg" style="height: 100%; background: linear-gradient(180deg, #FBBF24, #F59E0B);"></div>
          </div>
          <div class="flex-1 flex flex-col items-center gap-1">
            <span class="text-[9px] text-gray-400">¥156</span>
            <div class="w-full rounded-t-lg" style="height: 78%; background: linear-gradient(180deg, #FBBF24, #F59E0B);"></div>
          </div>
          <div class="flex-1 flex flex-col items-center gap-1">
            <span class="text-[9px] text-gray-400">¥68</span>
            <div class="w-full rounded-t-lg" style="height: 34%; background: linear-gradient(180deg, #FBBF24, #F59E0B);"></div>
          </div>
          <div class="flex-1 flex flex-col items-center gap-1">
            <span class="text-[9px] text-primary font-semibold">¥33</span>
            <div class="w-full rounded-t-lg" style="height: 16%; background: linear-gradient(180deg, #F59E0B, #D97706);"></div>
          </div>
        </div>
        <div class="flex justify-between text-[10px] text-gray-400">
          <span>周一</span>
          <span>周二</span>
          <span>周三</span>
          <span>周四</span>
          <span>周五</span>
          <span>周六</span>
          <span class="text-primary font-medium">今天</span>
        </div>
      </div>

      <!-- 支出分类占比（模拟环形图） -->
      <div class="mx-5 mt-5 bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-semibold text-gray-800">支出分类</span>
          <span class="text-xs text-gray-400">本月</span>
        </div>

        <!-- 模拟环形图 -->
        <div class="flex items-center gap-5">
          <div class="relative w-32 h-32 shrink-0">
            <svg viewBox="0 0 36 36" class="w-full h-full -rotate-90">
              <circle cx="18" cy="18" r="13" fill="none" stroke="#FED7AA" stroke-width="6" stroke-dasharray="39.3 81.7" stroke-dashoffset="0"/>
              <circle cx="18" cy="18" r="13" fill="none" stroke="#93C5FD" stroke-width="6" stroke-dasharray="9.8 81.7" stroke-dashoffset="-39.3"/>
              <circle cx="18" cy="18" r="13" fill="none" stroke="#F9A8D4" stroke-width="6" stroke-dasharray="26.4 81.7" stroke-dashoffset="-49.1"/>
              <circle cx="18" cy="18" r="13" fill="none" stroke="#C4B5FD" stroke-width="6" stroke-dasharray="5.5 81.7" stroke-dashoffset="-75.5"/>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <p class="text-base font-bold text-gray-800">¥3,260</p>
              <p class="text-[10px] text-gray-400">总支出</p>
            </div>
          </div>
          <div class="flex-1 space-y-3">
            <div class="flex items-center gap-2">
              <div class="w-3 h-3 rounded-full bg-orange-300"></div>
              <span class="text-xs text-gray-600 flex-1">餐饮</span>
              <span class="text-xs font-semibold text-gray-800">¥1,280</span>
              <span class="text-[10px] text-gray-400">39%</span>
            </div>
            <div class="flex items-center gap-2">
              <div class="w-3 h-3 rounded-full bg-pink-300"></div>
              <span class="text-xs text-gray-600 flex-1">购物</span>
              <span class="text-xs font-semibold text-gray-800">¥860</span>
              <span class="text-[10px] text-gray-400">26%</span>
            </div>
            <div class="flex items-center gap-2">
              <div class="w-3 h-3 rounded-full bg-blue-300"></div>
              <span class="text-xs text-gray-600 flex-1">交通</span>
              <span class="text-xs font-semibold text-gray-800">¥320</span>
              <span class="text-[10px] text-gray-400">10%</span>
            </div>
            <div class="flex items-center gap-2">
              <div class="w-3 h-3 rounded-full bg-purple-300"></div>
              <span class="text-xs text-gray-600 flex-1">娱乐</span>
              <span class="text-xs font-semibold text-gray-800">¥180</span>
              <span class="text-[10px] text-gray-400">6%</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 预算执行情况 -->
      <div class="mx-5 mt-5 bg-white rounded-2xl p-5 shadow-sm mb-4">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-semibold text-gray-800">预算执行</span>
          <span class="text-xs text-primary">本月</span>
        </div>

        <div class="space-y-4">
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <div class="flex items-center gap-2">
                <span class="text-sm">🍜</span>
                <span class="text-xs text-gray-600">餐饮</span>
              </div>
              <span class="text-xs text-gray-500">¥1,280 / ¥2,000</span>
            </div>
            <div class="w-full h-2.5 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-orange-400" style="width: 64%"></div>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <div class="flex items-center gap-2">
                <span class="text-sm">🚗</span>
                <span class="text-xs text-gray-600">交通</span>
              </div>
              <span class="text-xs text-gray-500">¥320 / ¥800</span>
            </div>
            <div class="w-full h-2.5 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-blue-400" style="width: 40%"></div>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <div class="flex items-center gap-2">
                <span class="text-sm">🛍️</span>
                <span class="text-xs text-gray-600">购物</span>
              </div>
              <span class="text-xs text-gray-500">¥860 / ¥1,500</span>
            </div>
            <div class="w-full h-2.5 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-pink-400" style="width: 57%"></div>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <div class="flex items-center gap-2">
                <span class="text-sm">🎮</span>
                <span class="text-xs text-gray-600">娱乐</span>
              </div>
              <span class="text-xs text-gray-500">¥180 / ¥600</span>
            </div>
            <div class="w-full h-2.5 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-purple-400" style="width: 30%"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="h-4"></div>
    </main>

    <!-- 底部导航 -->
    <nav class="border-t bg-white safe-area-bottom">
      <div class="flex justify-around py-1.5">
        <a href="01-index.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline">
          <i data-lucide="home" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">首页</span>
        </a>
        <a href="02-record.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline">
          <i data-lucide="pencil" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">记账</span>
        </a>
        <a href="03-chart.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline">
          <i data-lucide="bar-chart-3" class="w-5 h-5 text-primary"></i>
          <span class="text-[10px] text-primary font-medium">统计</span>
        </a>
        <a href="04-my.html" class="flex flex-col items-center gap-0.5 min-w-[64px] py-1 no-underline">
          <i data-lucide="user" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">我的</span>
        </a>
      </div>
      <div class="home-indicator"></div>
    </nav>

  </div>
  <script>lucide.createIcons();</script>
</body>
</html>

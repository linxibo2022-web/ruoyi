<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, user-scalable=no">
<title>在线学堂 - 学习</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 375px; height: 812px; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; background: #f5f5f5; position: relative; display: flex; flex-direction: column; }
  .status-bar { height: 44px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
  .status-bar span { color: #1f2937; font-size: 12px; font-weight: 600; }
  .screen { flex: 1; overflow-y: auto; padding-bottom: 80px; }
  .screen::-webkit-scrollbar { display: none; }
  .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e5e7eb; padding-bottom: 20px; z-index: 50; }
  .tab-bar a { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 0 4px; text-decoration: none; color: #9ca3af; font-size: 10px; gap: 2px; }
  .tab-bar a.active { color: #10B981; }
  .tab-bar a i { width: 22px; height: 22px; }
  .safe-area-bottom { height: 20px; background: white; }
  .home-indicator { width: 134px; height: 5px; background: #1a1a1a; border-radius: 3px; margin: 0 auto; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>9:41</span>
    <span>●●●●○ ⚡ 85%</span>
  </div>

  <!-- Screen Content -->
  <div class="screen">
    <!-- Header -->
    <div style="background: white; padding: 12px 16px 16px;">
      <div style="font-size: 20px; font-weight: 700; color: #1f2937; margin-bottom: 16px;">学习</div>

      <!-- 学习统计 -->
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
        <div style="background: linear-gradient(135deg, #ecfdf5, #d1fae5); border-radius: 12px; padding: 14px 10px; text-align: center;">
          <div style="font-size: 22px; font-weight: 700; color: #10B981;">45</div>
          <div style="font-size: 10px; color: #6b7280; margin-top: 2px;">今日(min)</div>
        </div>
        <div style="background: linear-gradient(135deg, #eff6ff, #dbeafe); border-radius: 12px; padding: 14px 10px; text-align: center;">
          <div style="font-size: 22px; font-weight: 700; color: #3b82f6;">5/7</div>
          <div style="font-size: 10px; color: #6b7280; margin-top: 2px;">本周目标</div>
        </div>
        <div style="background: linear-gradient(135deg, #fef3c7, #fde68a); border-radius: 12px; padding: 14px 10px; text-align: center;">
          <div style="font-size: 22px; font-weight: 700; color: #f59e0b;">8</div>
          <div style="font-size: 10px; color: #6b7280; margin-top: 2px;">累计课程</div>
        </div>
      </div>
    </div>

    <!-- 学习日历 -->
    <div style="margin: 12px 16px; background: white; border-radius: 14px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <span style="font-size: 15px; font-weight: 600; color: #1f2937;">本周打卡</span>
        <span style="font-size: 11px; color: #10B981;">连续12天 🔥</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center;">
        <div style="font-size: 10px; color: #9ca3af; margin-bottom: 6px;">一</div>
        <div style="font-size: 10px; color: #9ca3af; margin-bottom: 6px;">二</div>
        <div style="font-size: 10px; color: #9ca3af; margin-bottom: 6px;">三</div>
        <div style="font-size: 10px; color: #9ca3af; margin-bottom: 6px;">四</div>
        <div style="font-size: 10px; color: #9ca3af; margin-bottom: 6px;">五</div>
        <div style="font-size: 10px; color: #9ca3af; margin-bottom: 6px;">六</div>
        <div style="font-size: 10px; color: #9ca3af; margin-bottom: 6px;">日</div>
        <!-- Days -->
        <div style="width: 32px; height: 32px; background: #10B981; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; margin: 0 auto;">7</div>
        <div style="width: 32px; height: 32px; background: #10B981; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; margin: 0 auto;">8</div>
        <div style="width: 32px; height: 32px; background: #10B981; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; margin: 0 auto;">9</div>
        <div style="width: 32px; height: 32px; background: #10B981; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; margin: 0 auto;">10</div>
        <div style="width: 32px; height: 32px; background: #10B981; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; margin: 0 auto;">11</div>
        <div style="width: 32px; height: 32px; background: #d1fae5; color: #10B981; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; margin: 0 auto;">12</div>
        <div style="width: 32px; height: 32px; background: #f3f4f6; color: #9ca3af; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; margin: 0 auto;">13</div>
      </div>
    </div>

    <!-- 正在学习 -->
    <div style="padding: 0 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-size: 16px; font-weight: 700; color: #1f2937;">正在学习</span>
        <span style="font-size: 12px; color: #10B981;">全部 ›</span>
      </div>

      <!-- Course Progress 1 -->
      <div style="background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);">
        <div style="display: flex; gap: 12px;">
          <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <span style="color: white; font-size: 10px; font-weight: 600;">Vue3</span>
          </div>
          <div style="flex: 1;">
            <div style="font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 4px;">Vue3+TypeScript企业级实战</div>
            <div style="font-size: 11px; color: #9ca3af; margin-bottom: 8px;">已学 42/86 章节</div>
            <div style="background: #f3f4f6; border-radius: 4px; height: 6px; overflow: hidden;">
              <div style="background: linear-gradient(90deg, #10B981, #34d399); height: 100%; width: 49%; border-radius: 4px;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 4px;">
              <span style="font-size: 10px; color: #10B981; font-weight: 600;">49%</span>
              <span style="font-size: 10px; color: #9ca3af;">上次学习 2小时前</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Course Progress 2 -->
      <div style="background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);">
        <div style="display: flex; gap: 12px;">
          <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #10b981, #06b6d4); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <span style="color: white; font-size: 10px; font-weight: 600;">AI</span>
          </div>
          <div style="flex: 1;">
            <div style="font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 4px;">ChatGPT与AI应用实战</div>
            <div style="font-size: 11px; color: #9ca3af; margin-bottom: 8px;">已学 28/42 章节</div>
            <div style="background: #f3f4f6; border-radius: 4px; height: 6px; overflow: hidden;">
              <div style="background: linear-gradient(90deg, #10B981, #34d399); height: 100%; width: 67%; border-radius: 4px;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 4px;">
              <span style="font-size: 10px; color: #10B981; font-weight: 600;">67%</span>
              <span style="font-size: 10px; color: #9ca3af;">上次学习 昨天</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Course Progress 3 -->
      <div style="background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);">
        <div style="display: flex; gap: 12px;">
          <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #f59e0b, #f97316); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <span style="color: white; font-size: 10px; font-weight: 600;">UI</span>
          </div>
          <div style="flex: 1;">
            <div style="font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 4px;">Figma从入门到精通</div>
            <div style="font-size: 11px; color: #9ca3af; margin-bottom: 8px;">已学 12/64 章节</div>
            <div style="background: #f3f4f6; border-radius: 4px; height: 6px; overflow: hidden;">
              <div style="background: linear-gradient(90deg, #10B981, #34d399); height: 100%; width: 19%; border-radius: 4px;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 4px;">
              <span style="font-size: 10px; color: #10B981; font-weight: 600;">19%</span>
              <span style="font-size: 10px; color: #9ca3af;">上次学习 3天前</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Course Progress 4 -->
      <div style="background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);">
        <div style="display: flex; gap: 12px;">
          <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <span style="color: white; font-size: 10px; font-weight: 600;">Java</span>
          </div>
          <div style="flex: 1;">
            <div style="font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 4px;">Java架构师成长之路</div>
            <div style="font-size: 11px; color: #9ca3af; margin-bottom: 8px;">已学 85/120 章节</div>
            <div style="background: #f3f4f6; border-radius: 4px; height: 6px; overflow: hidden;">
              <div style="background: linear-gradient(90deg, #10B981, #34d399); height: 100%; width: 71%; border-radius: 4px;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 4px;">
              <span style="font-size: 10px; color: #10B981; font-weight: 600;">71%</span>
              <span style="font-size: 10px; color: #9ca3af;">上次学习 5天前</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <a href="01-index.html">
      <i data-lucide="home"></i>
      <span>首页</span>
    </a>
    <a href="02-course.html">
      <i data-lucide="book-open"></i>
      <span>课程</span>
    </a>
    <a href="03-study.html" class="active">
      <i data-lucide="graduation-cap"></i>
      <span>学习</span>
    </a>
    <a href="04-my.html">
      <i data-lucide="user"></i>
      <span>我的</span>
    </a>
  </div>
  <div class="home-indicator"></div>
</div>

<script>
  lucide.createIcons();
</script>
</body>
</html>

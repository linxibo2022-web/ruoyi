<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>外卖配送 - 我的</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#F97316',
            'primary-light': '#FFF7ED',
            'primary-dark': '#EA580C',
            accent: '#1A1A2E',
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .phone-frame {
      width: 375px; height: 812px; margin: 20px auto;
      border: 8px solid #1a1a1a; border-radius: 44px;
      overflow: hidden; position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .status-bar {
      height: 44px; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 600;
    }
    .safe-area-bottom { padding-bottom: 34px; }
    .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 3px; margin: 8px auto; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
<body class="bg-gray-200 flex items-start justify-center min-h-screen py-8">

  <div class="phone-frame bg-gray-100 flex flex-col">

    <!-- 状态栏 -->
    <div class="status-bar text-white" style="background: linear-gradient(135deg, #F97316, #EA580C);">
      <span>9:41</span>
      <div class="flex items-center gap-1">
        <i data-lucide="signal" class="w-4 h-4"></i>
        <i data-lucide="wifi" class="w-4 h-4"></i>
        <i data-lucide="battery-full" class="w-4 h-4"></i>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="flex-1 overflow-y-auto hide-scrollbar">

      <!-- 渐变头部 + 用户信息 -->
      <div class="px-5 pt-5 pb-8 text-white" style="background: linear-gradient(135deg, #F97316, #EA580C);">
        <div class="flex items-center justify-between mb-4">
          <span class="text-base font-bold">我的</span>
          <a href="01-index.html"><i data-lucide="settings" class="w-5 h-5 text-white/80"></i></a>
        </div>
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-3xl border-2 border-white/40">😊</div>
          <div>
            <p class="font-bold text-lg">美食达人</p>
            <p class="text-xs text-white/70 mt-1">手机号 138****8888</p>
            <div class="flex items-center gap-2 mt-1.5">
              <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full">超级会员</span>
              <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full">积分 2680</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 我的订单 -->
      <div class="bg-white rounded-xl mx-4 -mt-4 relative z-10 shadow-sm">
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-50">
          <span class="font-bold text-sm text-gray-800">我的订单</span>
          <span class="text-xs text-gray-400 flex items-center">全部订单 <i data-lucide="chevron-right" class="w-3 h-3 ml-0.5"></i></span>
        </div>
        <div class="flex items-center justify-around py-4">
          <div class="flex flex-col items-center gap-1.5 relative">
            <div class="w-10 h-10 bg-primary-light rounded-full flex items-center justify-center">
              <i data-lucide="wallet" class="w-5 h-5 text-primary"></i>
            </div>
            <span class="text-[11px] text-gray-600">待付款</span>
            <span class="absolute -top-1 right-0 w-4 h-4 bg-red-500 rounded-full text-white text-[10px] flex items-center justify-center">2</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center">
              <i data-lucide="clock" class="w-5 h-5 text-blue-500"></i>
            </div>
            <span class="text-[11px] text-gray-600">待配送</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <div class="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center">
              <i data-lucide="bike" class="w-5 h-5 text-green-500"></i>
            </div>
            <span class="text-[11px] text-gray-600">配送中</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <div class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center">
              <i data-lucide="check-circle" class="w-5 h-5 text-gray-500"></i>
            </div>
            <span class="text-[11px] text-gray-600">已完成</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <div class="w-10 h-10 bg-red-50 rounded-full flex items-center justify-center">
              <i data-lucide="rotate-ccw" class="w-5 h-5 text-red-400"></i>
            </div>
            <span class="text-[11px] text-gray-600">售后</span>
          </div>
        </div>
      </div>

      <!-- 常用功能 -->
      <div class="bg-white rounded-xl mx-4 mt-3 shadow-sm">
        <div class="px-4 py-3 border-b border-gray-50">
          <span class="font-bold text-sm text-gray-800">常用功能</span>
        </div>
        <div class="grid grid-cols-4 py-4 px-2">
          <div class="flex flex-col items-center gap-1.5">
            <div class="w-10 h-10 bg-primary-light rounded-xl flex items-center justify-center">
              <i data-lucide="map-pin" class="w-5 h-5 text-primary"></i>
            </div>
            <span class="text-[11px] text-gray-600">收货地址</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <div class="w-10 h-10 bg-red-50 rounded-xl flex items-center justify-center">
              <i data-lucide="ticket" class="w-5 h-5 text-red-500"></i>
            </div>
            <span class="text-[11px] text-gray-600">优惠券</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <div class="w-10 h-10 bg-pink-50 rounded-xl flex items-center justify-center">
              <i data-lucide="heart" class="w-5 h-5 text-pink-500"></i>
            </div>
            <span class="text-[11px] text-gray-600">收藏</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center">
              <i data-lucide="history" class="w-5 h-5 text-blue-500"></i>
            </div>
            <span class="text-[11px] text-gray-600">历史</span>
          </div>
        </div>
      </div>

      <!-- 更多功能列表 -->
      <div class="bg-white rounded-xl mx-4 mt-3 mb-4 shadow-sm overflow-hidden">
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-gray-50 active:bg-gray-50">
          <div class="flex items-center gap-3">
            <i data-lucide="headphones" class="w-5 h-5 text-gray-500"></i>
            <span class="text-sm text-gray-700">在线客服</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-gray-50 active:bg-gray-50">
          <div class="flex items-center gap-3">
            <i data-lucide="star" class="w-5 h-5 text-gray-500"></i>
            <span class="text-sm text-gray-700">我的评价</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-gray-50 active:bg-gray-50">
          <div class="flex items-center gap-3">
            <i data-lucide="gift" class="w-5 h-5 text-gray-500"></i>
            <span class="text-sm text-gray-700">邀请有礼</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] text-primary bg-primary-light px-1.5 py-0.5 rounded">赚红包</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
          </div>
        </div>
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-gray-50 active:bg-gray-50">
          <div class="flex items-center gap-3">
            <i data-lucide="shield" class="w-5 h-5 text-gray-500"></i>
            <span class="text-sm text-gray-700">账号安全</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-gray-50 active:bg-gray-50">
          <div class="flex items-center gap-3">
            <i data-lucide="help-circle" class="w-5 h-5 text-gray-500"></i>
            <span class="text-sm text-gray-700">帮助中心</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
        <div class="flex items-center justify-between px-4 py-3.5 active:bg-gray-50">
          <div class="flex items-center gap-3">
            <i data-lucide="info" class="w-5 h-5 text-gray-500"></i>
            <span class="text-sm text-gray-700">关于我们</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
        </div>
      </div>

    </main>

    <!-- 底部 Tab 栏 -->
    <div class="bg-white border-t border-gray-100 safe-area-bottom">
      <div class="flex items-center justify-around py-2">
        <a href="01-index.html" class="flex flex-col items-center gap-0.5">
          <i data-lucide="home" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">首页</span>
        </a>
        <a href="02-menu.html" class="flex flex-col items-center gap-0.5">
          <i data-lucide="utensils-crossed" class="w-5 h-5 text-gray-400"></i>
          <span class="text-[10px] text-gray-400">点餐</span>
        </a>
        <a href="03-my.html" class="flex flex-col items-center gap-0.5">
          <i data-lucide="user" class="w-5 h-5 text-primary"></i>
          <span class="text-[10px] text-primary font-medium">我的</span>
        </a>
      </div>
      <div class="home-indicator"></div>
    </div>

  </div>

  <script>lucide.createIcons();</script>
</body>
</html>

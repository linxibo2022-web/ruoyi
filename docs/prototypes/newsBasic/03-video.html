<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>视频 - 新闻资讯</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 375px; height: 812px; border: 8px solid #1a1a1a; border-radius: 44px; overflow: hidden; background: #f5f5f5; position: relative; display: flex; flex-direction: column; }
  .status-bar { height: 44px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
  .status-bar .time { color: #1a1a1a; font-size: 14px; font-weight: 600; }
  .status-bar .icons { display: flex; gap: 6px; color: #1a1a1a; }
  .screen-content { flex: 1; overflow-y: auto; background: #f5f5f5; }
  .screen-content::-webkit-scrollbar { display: none; }
  .tab-bar { height: 56px; background: white; display: flex; border-top: 1px solid #e5e5e5; flex-shrink: 0; }
  .tab-bar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #999; font-size: 10px; gap: 2px; }
  .tab-bar a.active { color: #EF4444; }
  .tab-bar a i { width: 22px; height: 22px; }
  .safe-area-bottom { height: 20px; background: white; flex-shrink: 0; }
  .home-indicator { width: 134px; height: 5px; background: #1a1a1a; border-radius: 3px; margin: 0 auto; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); }

  .video-tabs { display: flex; background: white; border-bottom: 1px solid #f0f0f0; padding: 0 16px; flex-shrink: 0; }
  .video-tab { padding: 12px 16px; font-size: 15px; color: #666; cursor: pointer; position: relative; }
  .video-tab.active { color: #EF4444; font-weight: 600; }
  .video-tab.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; background: #EF4444; border-radius: 2px; }

  .video-list { padding: 8px; }
  .video-card { background: white; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .video-cover { width: 100%; height: 200px; background: linear-gradient(135deg, #1a1a1a, #333); position: relative; display: flex; align-items: center; justify-content: center; }
  .video-cover .play-btn { width: 50px; height: 50px; background: rgba(239, 68, 68, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
  .video-cover .duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
  .video-cover .cover-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.15); }
  .video-info { padding: 10px 12px; }
  .video-title { font-size: 14px; font-weight: 500; color: #1a1a1a; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-size: 12px; color: #999; }
  .video-author { display: flex; align-items: center; gap: 6px; }
  .video-avatar { width: 22px; height: 22px; background: linear-gradient(135deg, #EF4444, #f87171); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; }
</style>
</head>
<body>
<div class="phone-frame">
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <i data-lucide="signal" style="width:14px;height:14px"></i>
      <i data-lucide="wifi" style="width:14px;height:14px"></i>
      <i data-lucide="battery-full" style="width:14px;height:14px"></i>
    </div>
  </div>

  <!-- Video Tabs -->
  <div class="video-tabs">
    <div class="video-tab active">推荐</div>
    <div class="video-tab">热播</div>
    <div class="video-tab">关注</div>
  </div>

  <!-- Screen Content -->
  <div class="screen-content">
    <div class="video-list">

      <!-- Video Card 1 -->
      <div class="video-card">
        <div class="video-cover">
          <i data-lucide="film" class="cover-icon" style="width:80px;height:80px"></i>
          <div class="play-btn"><i data-lucide="play" style="width:24px;height:24px;margin-left:3px"></i></div>
          <span class="duration">03:45</span>
        </div>
        <div class="video-info">
          <div class="video-title">探秘深海：中国载人深潜器成功抵达万米海沟</div>
          <div class="video-meta">
            <div class="video-author">
              <div class="video-avatar">央</div>
              <span>央视新闻</span>
            </div>
            <span>128.6万次播放</span>
          </div>
        </div>
      </div>

      <!-- Video Card 2 -->
      <div class="video-card">
        <div class="video-cover">
          <i data-lucide="film" class="cover-icon" style="width:80px;height:80px"></i>
          <div class="play-btn"><i data-lucide="play" style="width:24px;height:24px;margin-left:3px"></i></div>
          <span class="duration">05:12</span>
        </div>
        <div class="video-info">
          <div class="video-title">2026年最值得关注的十大科技趋势</div>
          <div class="video-meta">
            <div class="video-author">
              <div class="video-avatar">科</div>
              <span>科技前沿</span>
            </div>
            <span>86.3万次播放</span>
          </div>
        </div>
      </div>

      <!-- Video Card 3 -->
      <div class="video-card">
        <div class="video-cover">
          <i data-lucide="film" class="cover-icon" style="width:80px;height:80px"></i>
          <div class="play-btn"><i data-lucide="play" style="width:24px;height:24px;margin-left:3px"></i></div>
          <span class="duration">02:30</span>
        </div>
        <div class="video-info">
          <div class="video-title">街头美食：隐藏在小巷里的百年老店</div>
          <div class="video-meta">
            <div class="video-author">
              <div class="video-avatar">美</div>
              <span>美食探店</span>
            </div>
            <span>52.1万次播放</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <a href="01-index.html">
      <i data-lucide="home"></i>
      <span>首页</span>
    </a>
    <a href="02-category.html">
      <i data-lucide="layout-grid"></i>
      <span>频道</span>
    </a>
    <a href="03-video.html" class="active">
      <i data-lucide="play-circle"></i>
      <span>视频</span>
    </a>
    <a href="04-my.html">
      <i data-lucide="user"></i>
      <span>我的</span>
    </a>
  </div>

  <!-- Safe Area -->
  <div class="safe-area-bottom"></div>
  <div class="home-indicator"></div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
